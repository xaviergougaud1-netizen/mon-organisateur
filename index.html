<!doctype html>
<html lang="fr" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0c0e13">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Thêta · Atelier V2</title>
<style>
:root{--a1:#4c6ef5;--a2:#1e3a8a;--r:18px;--navh:66px;color-scheme:dark}
html[data-theme=dark]{--bg:#0c0e13;--card:#171a22;--card2:#20242f;--card3:#2c3140;--text:#eef1f7;--muted:#959db0;--line:rgba(255,255,255,.07);--glass:rgba(23,26,34,.74);--shadow:0 8px 24px rgba(0,0,0,.4);--relief:inset 0 1px 0 rgba(255,255,255,.05);--toast:#262b38}
html[data-theme=light]{color-scheme:light;--bg:#eef1f6;--card:#fff;--card2:#f2f4f8;--card3:#e2e6ee;--text:#141821;--muted:#5d6577;--line:rgba(10,20,40,.09);--glass:rgba(255,255,255,.78);--shadow:0 8px 22px rgba(30,40,70,.10);--relief:inset 0 1px 0 rgba(255,255,255,.9);--toast:#1f2430}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);overflow-x:clip;max-width:100%}
body{font:15.5px/1.45 var(--font,system-ui,sans-serif);min-height:100dvh;overscroll-behavior-y:contain}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{opacity:.4}
.hidden{display:none!important}
.grow{flex:1;min-width:0}
.muted{color:var(--muted)}.small{font-size:13px}
#top{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:8px;padding:calc(env(safe-area-inset-top) + 14px) 16px 10px;background:var(--bg);max-width:720px;margin:0 auto}
body.navtop #top{padding-top:calc(env(safe-area-inset-top) + var(--navh) + 22px)}
#top h1{flex:1;margin:0;font-size:24px;font-weight:800;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#topActions{display:flex;gap:6px}
main{max-width:720px;margin:0 auto;padding:2px 16px calc(var(--navh) + 110px + var(--lift,18px) + env(safe-area-inset-bottom))}
body.navtop main{padding-bottom:calc(110px + env(safe-area-inset-bottom))}
/* Fond d'écran zen */
#bg{position:fixed;inset:-20px;z-index:-2;background:var(--bg) center/cover no-repeat;transition:filter .3s}
#bgVeil{position:fixed;inset:0;z-index:-1;background:var(--bg);pointer-events:none;transition:opacity .2s}
body.hasbg{background:transparent}
body.hasbg #top{background:color-mix(in srgb,var(--bg) 35%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
body.hasbg .card,body.hasbg .kpi,body.hasbg .banner{background:color-mix(in srgb,var(--card) 80%,transparent);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
body.hasbg .item{background:color-mix(in srgb,var(--card) 86%,transparent)}
body.hasbg .chip:not(.on),body.hasbg .crumb:not(.cur){background:color-mix(in srgb,var(--card) 80%,transparent)}
body.hasbg .sec{color:var(--text);opacity:.8;text-shadow:0 1px 6px color-mix(in srgb,var(--bg) 70%,transparent)}
.fonts{display:flex;flex-direction:column;gap:8px}
.fontopt{border:1px solid var(--line);background:var(--card2);border-radius:14px;padding:10px 12px;text-align:left;display:flex;flex-direction:column;gap:2px}
.fontopt b{font-size:16px}.fontopt small{color:var(--muted);font-size:13px}
.fontopt.on{border-color:var(--a1);box-shadow:inset 0 0 0 1px var(--a1)}
.bgs{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:10px}
.bgt{position:relative;aspect-ratio:3/5;border-radius:14px;border:3px solid transparent;background:var(--card2) center/cover;padding:0;overflow:hidden;font-size:12.5px;font-weight:650;color:var(--muted)}
.bgt.on{border-color:var(--a1)}
.bgt span{position:absolute;left:0;right:0;bottom:0;padding:4px 2px;background:rgba(0,0,0,.45);color:#fff;font-size:11.5px}
.bgt img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.bgt.add{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;border:2px dashed var(--line)}
.range{display:flex;align-items:center;gap:10px;margin-top:12px}
.range input{flex:1;accent-color:var(--a1)}
.range b{min-width:42px;text-align:right;font-size:13px;color:var(--muted)}
/* Nav */
#nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(10px + var(--lift,18px) + env(safe-area-inset-bottom));width:min(560px,calc(100% - 20px));display:flex;padding:6px;border-radius:26px;background:var(--glass);-webkit-backdrop-filter:blur(18px) saturate(1.5);backdrop-filter:blur(18px) saturate(1.5);border:1px solid var(--line);box-shadow:var(--shadow);z-index:20}
body.navtop #nav{bottom:auto;top:calc(8px + env(safe-area-inset-top))}
#nav button{flex:1;min-width:0;border:0;background:none;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 0;font-size:11px;font-weight:650;position:relative}
#nav .ic{font-size:19px;line-height:30px;width:100%;max-width:56px;border-radius:16px;transition:background .2s}
#nav button.on{color:var(--text)}
#nav button.on .ic{background:linear-gradient(135deg,var(--ta,var(--a1)),var(--tb,var(--a2)));box-shadow:0 4px 12px color-mix(in srgb,var(--ta,var(--a1)) 45%,transparent)}
#nav .badge{position:absolute;top:0;right:calc(50% - 26px);background:#ff5d6c;color:#fff;font-style:normal;font-size:10px;min-width:17px;height:17px;border-radius:9px;display:grid;place-items:center;padding:0 4px}
/* Generic */
.sec{margin:22px 4px 8px;font-size:12.5px;font-weight:750;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);display:flex;align-items:center;gap:8px}
.sec .n{background:var(--card3);border-radius:10px;padding:0 7px;font-size:11px;color:var(--text);letter-spacing:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow),var(--relief);padding:14px}
.list{display:flex;flex-direction:column;gap:8px}
.item{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px;box-shadow:0 2px 8px rgba(0,0,0,.12),var(--relief);user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.ttl{font-weight:600;word-break:break-word}
.ttl a{color:var(--a1)}
.item.done .ttl{text-decoration:line-through;color:var(--muted)}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px;font-size:12.5px;color:var(--muted)}
.meta:empty{display:none}
.tag{display:inline-flex;align-items:center;gap:3px;background:var(--card2);border-radius:8px;padding:1px 7px;white-space:nowrap}
.tag.late{color:#ff7d87;background:rgba(255,80,90,.13)}
.tag.sync{color:#f5a623;background:rgba(255,170,40,.13)}
.tag.ok{color:#2fbf71;background:rgba(40,200,120,.13)}
.chk{flex:none;width:26px;height:26px;border-radius:9px;border:2px solid var(--muted);background:none;display:grid;place-items:center;padding:0;transition:.15s}
.chk.round{border-radius:50%}
.chk.on{border-color:transparent;background:linear-gradient(135deg,var(--a1),var(--a2))}
.chk.on::after{content:"";width:10px;height:5px;border:2.5px solid #fff;border-top:0;border-right:0;transform:translateY(-1px) rotate(-45deg)}
.prio{width:6px;align-self:stretch;border-radius:4px;flex:none}
.p-haute{background:#ff5d6c}.p-moyenne{background:#ffab40}.p-basse{background:#3ccf86}
.btn{border:0;border-radius:14px;padding:11px 16px;font-weight:650;background:var(--card2);display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none}
.btn.primary{background:linear-gradient(135deg,var(--a1),var(--a2));color:#fff;box-shadow:0 6px 16px color-mix(in srgb,var(--a1) 35%,transparent)}
.btn.ghost{background:none;border:1px solid var(--line)}
.btn.danger{color:#ff6b78}
.btn.sm{padding:7px 12px;font-size:13.5px;border-radius:11px}
.btn.block{width:100%;margin-top:10px}
.icon-btn{flex:none;width:40px;height:40px;border-radius:13px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;font-size:17px;padding:0}
.icon-btn.sm{width:34px;height:34px;border-radius:11px;font-size:14px}
.spin{animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.fab{position:fixed;right:max(18px,calc(50% - 342px));bottom:calc(var(--navh) + 30px + var(--lift,18px) + env(safe-area-inset-bottom));width:58px;height:58px;border-radius:20px;border:0;background:linear-gradient(135deg,var(--a1),var(--a2));color:#fff;font-size:30px;line-height:1;box-shadow:0 10px 24px color-mix(in srgb,var(--a1) 45%,transparent);z-index:15}
body.navtop .fab{bottom:calc(24px + env(safe-area-inset-bottom))}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 14px;font-weight:600;font-size:14px}
.chip.on{background:linear-gradient(135deg,var(--a1),var(--a2));color:#fff;border-color:transparent}
.progress{height:10px;background:var(--card3);border-radius:99px;overflow:hidden}
.progress>i{display:block;height:100%;background:linear-gradient(90deg,var(--a1),var(--a2));border-radius:99px;transition:width .5s}
.hero{background:linear-gradient(135deg,var(--a1),var(--a2));color:#fff;border-radius:24px;padding:18px;box-shadow:0 12px 28px color-mix(in srgb,var(--a1) 35%,transparent)}
.hero .progress{background:rgba(255,255,255,.25)}.hero .progress>i{background:#fff}
.hero-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:14px}
.hero-date{font-size:13px;opacity:.85;font-weight:650}
.hero-hello{font-size:22px;font-weight:800;margin-top:2px}
.hero-pct{font-size:30px;font-weight:800}
.hero-sub{font-size:13.5px;opacity:.92;margin-top:8px}
.banner{display:flex;width:100%;align-items:center;gap:8px;margin-top:12px;border:1px solid var(--line);background:var(--card);border-radius:16px;padding:12px 14px;font-weight:600;text-align:left}
.empty{text-align:center;padding:30px 20px;color:var(--muted)}
.empty .big{font-size:50px;margin-bottom:6px;filter:drop-shadow(0 8px 16px rgba(0,0,0,.25))}
.empty b{display:block;color:var(--text);font-size:17px;margin-bottom:4px}
.empty.mini{padding:14px;font-size:14px}
.srow{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.srow:last-child{border-bottom:0}
.sugg .stime{font-variant-numeric:tabular-nums;font-weight:700;font-size:13px;color:var(--a1);min-width:92px}
html[data-theme=dark] .sugg .stime{color:color-mix(in srgb,var(--a1) 60%,white)}
.cdot{width:12px;height:12px;border-radius:50%;flex:none}
/* Agenda */
.evtime{min-width:48px;font-weight:700;font-size:14px;font-variant-numeric:tabular-nums}
.evtime small{display:block;font-weight:500;color:var(--muted);font-size:12px}
.maplink{color:inherit;text-decoration:none}.tag.maplink{color:var(--a1);font-weight:600}
html[data-theme=dark] .tag.maplink{color:color-mix(in srgb,var(--a1) 55%,white)}
.evbar{width:4px;align-self:stretch;border-radius:3px;flex:none}
.status{display:flex;align-items:center;gap:10px}
/* Todo */
.crumbs{display:flex;gap:6px;overflow-x:auto;padding:2px 0 12px;scrollbar-width:none}
.crumbs::-webkit-scrollbar{display:none}
.crumb{flex:none;border:0;border-radius:999px;padding:6px 12px;background:var(--card2);font-size:13.5px;font-weight:600}
.crumb.cur{background:linear-gradient(135deg,var(--a1),var(--a2));color:#fff}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.tile{position:relative;border-radius:20px;padding:14px;min-height:96px;color:#fff;display:flex;flex-direction:column;justify-content:space-between;align-items:flex-start;box-shadow:var(--shadow),inset 0 1px 0 rgba(255,255,255,.25);user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;border:0;text-align:left}
.tile b{font-size:15.5px;line-height:1.2}
.tile small{opacity:.88;font-size:12.5px}
.tile .ic{font-size:22px}
.addbar{display:flex;gap:8px;align-items:center;padding:8px;margin-bottom:12px}
.addbar input{border:0!important;background:none!important}
.dragging{opacity:.95;box-shadow:0 18px 34px rgba(0,0,0,.45)!important;z-index:5;position:relative;will-change:transform}
.handle{color:var(--muted);font-size:18px;padding:4px 2px;touch-action:none;cursor:grab}
.thumbs{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.cover{width:44px;height:58px;object-fit:cover;border-radius:8px;flex:none;background:var(--card2)}
.imgadd{width:80px!important;height:80px!important;font-size:24px!important}
.thumbs img{width:64px;height:64px;object-fit:cover;border-radius:10px;background:var(--card2)}
.imgedit{display:flex;gap:8px;flex-wrap:wrap}
.imgedit div{position:relative}
.imgedit img{width:80px;height:80px;object-fit:cover;border-radius:12px;background:var(--card2)}
.imgedit div>button{position:absolute;top:-6px;right:-6px;width:24px;height:24px;border-radius:50%;border:0;background:#ff5d6c;color:#fff;font-size:12px;padding:0}
details.donebox{margin-top:14px}
details summary{cursor:pointer;color:var(--muted);font-weight:650;padding:8px 4px;list-style:none}
details summary::before{content:"▸ "}details[open] summary::before{content:"▾ "}
/* Notes */
.compose textarea{min-height:120px;border:0;background:var(--card2)}
.compose-bar{display:flex;align-items:center;gap:14px;margin-top:12px}
.mic{flex:none;width:72px;height:72px;border-radius:50%;border:0;font-size:30px;background:linear-gradient(135deg,var(--a1),var(--a2));color:#fff;box-shadow:0 10px 26px color-mix(in srgb,var(--a1) 45%,transparent)}
.mic.rec{background:linear-gradient(135deg,#ff5d6c,#c2185b);animation:pulse 1.2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,93,108,.6)}100%{box-shadow:0 0 0 22px rgba(255,93,108,0)}}
.raw{font-size:13.5px;color:var(--muted);font-style:italic;word-break:break-word;white-space:pre-line}
.prop{background:var(--card2);border-radius:16px;padding:12px;margin-top:10px;border:1px solid var(--line)}
.prop.unsure{border-color:rgba(255,170,40,.55)}
.tchips{display:flex;gap:6px;overflow-x:auto;margin-bottom:8px;scrollbar-width:none}
.tchips::-webkit-scrollbar{display:none}
.tchip{flex:none;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:5px 10px;font-size:13px;font-weight:600}
.tchip.on{background:linear-gradient(135deg,var(--a1),var(--a2));color:#fff;border-color:transparent}
.pf{display:flex;flex-direction:column;gap:8px}
.pbtns{display:flex;justify-content:flex-end;gap:8px;margin-top:10px}
.warn{font-size:12.5px;color:#f5a623;margin-bottom:6px;font-weight:600}
/* Dictée sur l'écran Jour */
.dict{display:flex;align-items:center;gap:14px;margin-top:12px;padding:12px 14px}
.dict .mic{width:62px;height:62px;font-size:27px}
.dict-t{font-weight:700;font-size:16px}
.dict.on .dict-t{font-weight:500;font-style:italic;max-height:7em;overflow:auto;white-space:pre-wrap;word-break:break-word}
.dict.on{border-color:color-mix(in srgb,#ff5d6c 50%,transparent)}
/* Frise semaine */
.daystrip{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:12px}
.dchip{border:1px solid var(--line);background:var(--card);border-radius:14px;padding:6px 0 5px;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:11px;color:var(--muted);font-weight:650}
.dchip b{font-size:17px;color:var(--text)}
.dchip i{width:5px;height:5px;border-radius:50%;background:currentColor}
.dchip.hol:not(.on){background:linear-gradient(180deg,rgba(255,196,0,.22),transparent)}
.dchip.on{background:linear-gradient(135deg,var(--a1),var(--a2));border-color:transparent;color:#fff}.dchip.on b{color:#fff}
body.hasbg .dchip:not(.on){background:color-mix(in srgb,var(--card) 80%,transparent)}
.slide-l{animation:sl .22s ease-out}.slide-r{animation:sr .22s ease-out}
@keyframes sl{from{transform:translateX(26px);opacity:.4}}@keyframes sr{from{transform:translateX(-26px);opacity:.4}}
.dict.mini{margin:0 0 12px;padding:10px 12px}.dict.mini .mic{width:48px;height:48px;font-size:21px}.dict.mini .dict-t{font-size:15px}
/* Sous-étapes */
.steps{display:flex;flex-direction:column;gap:6px}
.step{display:flex;align-items:center;gap:8px}
.step input{min-height:38px!important;padding:7px 10px!important}
.step.done input{text-decoration:line-through;color:var(--muted)}
.step.add input{background:none!important;border-style:dashed!important}
/* Recherche */
.sres{display:flex;flex-direction:column;gap:6px;margin-top:10px;max-height:62dvh;overflow:auto}
.sres button{display:flex;gap:10px;align-items:center;text-align:left;border:1px solid var(--line);background:var(--card2);border-radius:13px;padding:10px 12px}
.sres button small{display:block;color:var(--muted);font-size:12px}
.sres mark{background:color-mix(in srgb,var(--a1) 35%,transparent);color:inherit;border-radius:3px}
/* Vacances */
.holi{display:flex;align-items:center;gap:10px;border-radius:16px;padding:10px 14px;background:linear-gradient(135deg,rgba(255,196,0,.18),rgba(255,120,60,.14));border:1px solid rgba(255,170,40,.35);font-weight:600}
.holi small{display:block;font-weight:500;opacity:.8;font-size:12.5px}
/* v3.1 */
.hero-row{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.hstrip{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:12px}
.hd{width:auto;border:0;border-radius:10px;background:rgba(255,255,255,.15);color:#fff;padding:5px 0 4px;display:flex;flex-direction:column;align-items:center;font-size:11px;line-height:1.15;font-weight:700}
.hd b{font-size:16px}.hd i{width:4px;height:4px;border-radius:50%;background:currentColor;margin-top:1px}
.hd.on{background:#fff;color:var(--a2)}.hd.hol:not(.on){box-shadow:inset 0 -3px 0 #ffd43b}
.hero .hero-top{margin-bottom:10px;align-items:center}
body.vjour #main{touch-action:pan-y}
.chips.fit{display:grid;grid-template-columns:repeat(var(--n),1fr);overflow:visible}
.chips.fit .chip{padding:7px 1px;font-size:12.5px;text-align:center;min-width:0}
.dictbtns{display:flex;gap:6px}
.dict.mini{margin:12px 0;padding:8px 10px;gap:10px}.dict.mini .mic{width:42px;height:42px;font-size:19px;box-shadow:0 5px 14px color-mix(in srgb,var(--a1) 40%,transparent)}
.dict.mini .dict-t{font-size:15px}.dict.mini .small{font-size:12px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.dict.mini.on .small{-webkit-line-clamp:2}
.subs{margin-top:6px;display:flex;flex-direction:column;gap:2px}
.sub{display:flex;align-items:center;gap:8px;font-size:14px;padding:2px 0}
.sub.done span{text-decoration:line-through;color:var(--muted)}
.sub input{min-height:32px!important;padding:5px 9px!important;font-size:14px}
.chk.mini{width:20px;height:20px;border-width:2px}.chk.mini.on::after{width:8px;height:4px;border-width:2px}
.subx{border:0;background:none;color:var(--muted);font-size:13px;padding:2px 6px;opacity:.7}
.subadd{flex:none;align-self:flex-start;border:1px solid var(--line);background:var(--card2);border-radius:10px;width:30px;height:30px;font-size:16px;color:var(--muted);padding:0}
.tthumb{width:40px;height:40px;object-fit:cover;border-radius:9px;flex:none}
.tile .pills{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}
.pill{background:rgba(255,255,255,.22);border-radius:999px;padding:2px 8px;font-size:11.5px;font-weight:650;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.wdays{display:flex;gap:4px;flex-wrap:wrap;margin:-2px 0 8px}.wdays input{display:none}
.wdays span{display:block;padding:7px 10px;border-radius:10px;background:var(--card2);font-size:13px;font-weight:650;text-transform:capitalize}
.wdays input:checked+span{background:linear-gradient(135deg,var(--a1),var(--a2));color:#fff}
.psug,.bookres{display:flex;flex-direction:column;gap:4px;margin-top:6px}

.fontcur .grow{display:flex;flex-direction:column;gap:2px}.fcaret{font-size:18px;color:var(--muted)}
body.vjour #top{display:none}

/* Dock une main */
.micdock{position:fixed;left:max(16px,calc(50% - 344px));bottom:calc(var(--navh) + 30px + var(--lift,18px) + env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:flex-start;gap:8px;z-index:15}

.fabmic.rec{background:linear-gradient(135deg,#ff5d6c,#c2185b);animation:pulse 1.2s infinite}
.dockbtn{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--glass);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);font-size:19px;box-shadow:var(--shadow)}
.livebox{position:fixed;left:max(16px,calc(50% - 344px));right:max(16px,calc(50% - 344px));bottom:calc(var(--navh) + 100px + var(--lift,18px) + env(safe-area-inset-bottom));z-index:16;background:var(--card);border:1px solid color-mix(in srgb,#ff5d6c 45%,transparent);border-radius:18px;padding:12px 14px;box-shadow:var(--shadow)}

.item.top{align-items:flex-start}.item.top .chk{margin-top:1px}.item.top .handle{padding-top:2px}

.bgc.on .bgcthumb{border-color:var(--a1)}.bgc small{font-size:11px;font-weight:650;text-align:center;line-height:1.2}
/* Forms */
.fld{display:block;margin:10px 0}
.fld>span{display:block;font-size:12.5px;font-weight:650;color:var(--muted);margin:0 0 5px 2px}
input[type=text],input[type=date],input[type=time],input[type=number],input[type=search],input:not([type]),select,textarea{width:100%;background:var(--card2);border:1px solid var(--line);border-radius:13px;padding:10px 12px;outline:none;min-height:44px}
textarea{resize:vertical;min-height:90px}
input:focus,select:focus,textarea:focus{border-color:var(--a1)}
.row2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.row2>*{min-width:0}

.seg{display:flex;background:var(--card2);border-radius:13px;padding:4px;gap:4px}

/* Sheet */
#sheetWrap{position:fixed;inset:0;z-index:50}
#sheetWrap .backdrop{position:absolute;inset:0;background:rgba(0,0,0,.5);opacity:0;transition:opacity .2s}
.sheet{position:absolute;left:0;right:0;bottom:0;margin:0 auto;max-width:640px;max-height:92dvh;overflow:auto;background:var(--card);border-radius:26px 26px 0 0;padding:6px 18px calc(18px + env(safe-area-inset-bottom));transform:translateY(100%);transition:transform .22s ease-out;border:1px solid var(--line)}
#sheetWrap.open .backdrop{opacity:1}#sheetWrap.open .sheet{transform:none}
.grab{width:42px;height:5px;border-radius:9px;background:var(--card3);margin:6px auto 8px}

.sh-foot .btn.primary{margin-left:auto}
.menu{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:8px}

#toast{position:fixed;left:50%;transform:translate(-50%,20px);bottom:calc(var(--navh) + 100px + var(--lift,18px) + env(safe-area-inset-bottom));background:var(--toast);color:#fff;border-radius:14px;padding:11px 14px;display:flex;gap:14px;align-items:center;box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:.2s;z-index:60;width:max-content;max-width:92vw;font-size:14.5px}

#toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
#toast button{background:none;border:0;color:#9db4ff;font-weight:750;padding:0}

.kpi{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px}

.habit .hrow{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.dots{display:flex;gap:6px;justify-content:space-between}

.dot.on{background:linear-gradient(135deg,var(--a1),var(--a2));color:#fff}
.hchips{display:flex;flex-wrap:wrap;gap:8px}
.guide ol{padding-left:20px;margin:8px 0}.guide li{margin:6px 0}

/* ===== Atelier V2 : lisibilité, accessibilité et confort tactile ===== */
:root{--r:20px}
button,input,select,textarea{touch-action:manipulation}

function normalizeState(){
  const d=defaults();
  for(const k in d) if(S[k]===undefined) S[k]=d[k];

  if(!S.settings._lift2){ if(+S.settings.navLift===18) S.settings.navLift=4; S.settings._lift2=true; }

/* Images : IndexedDB (bien plus de place que localStorage) */
const IDB={db:null,
  open(){return this.db?Promise.resolve(this.db):new Promise((res,rej)=>{const r=indexedDB.open('theta_v2_images',1);r.onupgradeneeded=()=>r.result.createObjectStore('img');r.onsuccess=()=>{this.db=r.result;res(this.db)};r.onerror=()=>rej(r.error)})},
  async run(mode,fn){const db=await this.open();return new Promise((res,rej)=>{const t=db.transaction('img',mode);const r=fn(t.objectStore('img'));t.oncomplete=()=>res(r&&r.result);t.onerror=()=>rej(t.error)})},
  get(k){return this.run('readonly',s=>s.get(k))},
  set(k,v){return this.run('readwrite',s=>s.put(v,k))},
  del(k){return this.run('readwrite',s=>s.delete(k))},
  clear(){return this.run('readwrite',s=>s.clear())},
  async all(){const db=await this.open();return new Promise((res,rej)=>{const out={};const c=db.transaction('img').objectStore('img').openCursor();c.onsuccess=()=>{const cur=c.result;if(cur){out[cur.key]=cur.value;cur.continue()}else res(out)};c.onerror=()=>rej(c.error)})}
};
const imgCache={};
async function imgURL(id){if(imgCache[id])return imgCache[id];try{const v=await IDB.get(id);if(v)imgCache[id]=v;return v}catch(e){return null}}
function compress(file,max=1400,q=.72){return new Promise((res,rej)=>{const url=URL.createObjectURL(file);const im=new Image();
  im.onload=()=>{let w=im.naturalWidth,h=im.naturalHeight;const r=Math.min(1,max/Math.max(w,h));w=Math.round(w*r);h=Math.round(h*r);
    const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,w,h);x.drawImage(im,0,0,w,h);URL.revokeObjectURL(url);res(c.toDataURL('image/jpeg',q))};
  im.onerror=()=>{URL.revokeObjectURL(url);rej(new Error('Image illisible'))};im.src=url})}
async function storeImages(files){const ids=[];for(const f of files){if(!f.type.startsWith('image/'))continue;try{const data=await compress(f);const id='img_'+uid();await IDB.set(id,data);imgCache[id]=data;ids.push(id)}catch(e){toast('⚠️ '+e.message)}}return ids}

    ['#d29fa6','#b2879c','#8c7290','#655e7d','#4a4766'].forEach((c,i)=>{s+=`<path d="${ridge(470+i*70,22-i*2,i*2.4+1)}" fill="${c}" opacity="${.85+i*.03}"/>`});return s}},
  lac:{name:'Lac',svg(){let s='<defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9cbfbb"/><stop offset="1" stop-color="#e6efe8"/></linearGradient><linearGradient id="w" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8fb3ad"/><stop offset="1" stop-color="#3d6661"/></linearGradient></defs><rect width="400" height="560" fill="url(#g)"/><circle cx="120" cy="300" r="40" fill="#fbfaf2" opacity=".8"/>';
    s+=`<path d="${ridge(470,30,.6)}" fill="#7da199"/><path d="${ridge(515,18,2.1)}" fill="#5f8780"/><rect y="545" width="400" height="255" fill="url(#w)"/><ellipse cx="120" cy="600" rx="34" ry="5" fill="#fbfaf2" opacity=".45"/>`;
    for(let i=0;i<14;i++){const y=575+i*16,x=(i*73)%300;s+=`<rect x="${x}" y="${y}" width="${60+(i*37)%90}" height="1.6" rx="1" fill="#fff" opacity="${.28-i*.015}"/>`}return s}},
  jardin:{name:'Jardin',svg(){let s='<rect width="400" height="800" fill="#ece4d4"/>';

VIEWS.taches=()=>{
  const t=today(), cm=curMonth();
  const fri=nextFriday();
  let html=chips([['todo','À faire'],['today','Aujourd\'hui'],['fri','Ven. '+parseD(fri).getDate()],['done','Faites'],['all','Toutes']],taskFilter,'taskFilter',true)
    +chips([['all','Tout'],['travail','💼 Travail'],['perso','🏠 Perso']],taskCat,'taskCat',true);
  let L=S.tasks.filter(x=>taskCat==='all'||(taskCat==='travail')===isWork(x));
  if(taskFilter==='todo') L=L.filter(x=>!x.done);
  if(taskFilter==='today') L=L.filter(x=>x.date===t||dueOn(x,t)||(!x.done&&((x.date&&x.date<t)||(x.month&&x.month<=cm))));
  if(taskFilter==='done') L=L.filter(x=>x.done).sort((a,b)=>(b.doneAt||0)-(a.doneAt||0));
  if(taskFilter==='fri'){ L=L.filter(x=>x.date===fri).sort((a,b)=>a.done-b.done||byTime(a,b)||PRIO[a.priority]-PRIO[b.priority]);
    html+=sec('📅 '+fmtLong(fri),L.length||null)+(L.length?`<div class="list">${L.map(taskRow).join('')}</div>`:empty('','Rien de prévu vendredi',`<div><button class="btn sm primary" data-a="newTaskFri" style="margin-top:8px">+ Tâche pour vendredi</button></div>`,1));
    return {title:'Tâches',html,fab:'newTaskFriQ',mic:'task'}; }
  if(!L.length) html+=empty('✅','Rien ici','Ajoutez une tâche avec le bouton +, ou dictez avec Thêta écoute.');
  else if(taskFilter==='done') html+=`<div class="list">${L.map(taskRow).join('')}</div>`;
  else{
    const sorter=(a,b)=>a.done-b.done||taskScore(a)-taskScore(b)||(a.date||a.month||'').localeCompare(b.date||b.month||'')||byTime(a,b);
    const G=[['En retard',x=>!x.done&&((x.date&&x.date<t)||(x.month&&x.month<cm))],['Aujourd\'hui',x=>x.date===t||dueOn(x,t)],['Demain',x=>x.date===addDays(t,1)],['Cette semaine',x=>x.date>addDays(t,1)&&x.date<=addDays(t,7)],['Plus tard',x=>x.date>addDays(t,7)],
      ['🗓️ Ce mois-ci · '+fmtMonth(cm),x=>x.month===cm],['🗓️ Mois à venir',x=>x.month&&x.month>cm],['Sans date',x=>!x.date&&!x.month],['Passées',x=>x.done&&((x.date&&x.date<t)||(x.month&&x.month<cm))]];
    const used=new Set();
    for(const[name,fn]of G){ const g=L.filter(x=>!used.has(x)&&fn(x)).sort(sorter); g.forEach(x=>used.add(x)); if(g.length) html+=sec(name,g.length)+`<div class="list">${g.map(taskRow).join('')}</div>`; }
  }
  return {title:'Tâches',html,fab:'newTaskQ',mic:'task'};
};

function folderPath(id){const p=[];let f=S.folders.find(x=>x.id===id);let g=0;while(f&&g++<50){p.unshift(f);f=S.folders.find(x=>x.id===f.parentId)}return p}
function descendants(id){const out=[];const walk=p=>S.folders.filter(f=>f.parentId===p).forEach(f=>{out.push(f.id);walk(f.id)});walk(id);return out}
const countOpen=id=>{const ids=[id,...descendants(id)];return S.items.filter(i=>ids.includes(i.folderId)&&!i.done).length};
function folderOptions(sel,exclude=[]){
  const out=[['','🏠 Accueil (racine)']];
  const walk=(p,depth)=>S.folders.filter(f=>(f.parentId||null)===p&&!exclude.includes(f.id)).forEach(f=>{out.push([f.id,'\u00A0\u00A0'.repeat(depth)+(f.icon||'📁')+' '+f.name]);walk(f.id,depth+1)});

}
function tile(f){

}
function itemRow(i){

VIEWS.todo=()=>{

function reorder(arr,ids){const set=new Set(ids);const pos=[];arr.forEach((x,i)=>{if(set.has(x.id))pos.push(i)});const objs=ids.map(id=>arr.find(x=>x.id===id)).filter(Boolean);if(objs.length!==pos.length)return;pos.forEach((p,k)=>arr[p]=objs[k])}

/* Modes de l'agenda : liste (par défaut), jour, semaine, mois */
let agMode='liste', agDay=null;
const agCur=()=>agDay||today();
const agendaModeChips=()=>chips([['liste','Liste'],['jour','Jour'],['semaine','Semaine'],['mois','Mois']],agMode,'agendaMode',true);
const agendaNav=label=>`<div class="agnav"><button class="icon-btn" data-a="agendaStep" data-id="-1" aria-label="Précédent">‹</button><button class="chip" data-a="agendaToday">Aujourd'hui</button><b class="agtitle">${label}</b><button class="icon-btn" data-a="agendaStep" data-id="1" aria-label="Suivant">›</button></div>`;

function agendaDayView(){

function agendaWeekView(){
  const t=agCur(), D=parseD(t), mon=addDays(t,-((D.getDay()+6)%7)), M=parseD(mon), tod=today();
  const days=[...Array(7)].map((_,i)=>addDays(mon,i));
  const calCol=e=>(S.settings.calendars.find(c=>c.id===e.calId)||{}).color||e.color||'var(--a1)';
  const cols=days.map(d=>{
    const evs=eventsOn(d);
    const B=[...evs.filter(e=>e.start&&e.date===d).map(e=>{const s0=toMin(e.start);const en=e.end&&e.end>e.start?toMin(e.end):s0+60;return{s:s0,e:Math.max(en,s0+15),k:'e',o:e,c:calCol(e)}}),
             ...S.tasks.filter(x=>x.date===d&&x.time&&!x.done).map(x=>{const s0=toMin(x.time);return{s:s0,e:s0+Math.max(15,+x.duration||30),k:'t',o:x,c:''}}),...classB(d,'c')].sort((a,b)=>a.s-b.s||b.e-a.e);
    const allday=[...evs.filter(e=>!e.start||e.date!==d).map(e=>({k:'e',o:e,c:calCol(e)})),...S.tasks.filter(x=>x.date===d&&!x.time&&!x.done).map(x=>({k:'t',o:x,c:''}))];
    return {d,B,allday};
  });
  let H0=toMin(S.settings.dayStart||'08:00'), H1=toMin(S.settings.dayEnd||'20:00');
  cols.forEach(c=>c.B.forEach(b=>{H0=Math.min(H0,Math.floor(b.s/60)*60);H1=Math.max(H1,Math.min(1440,Math.ceil(b.e/60)*60))}));
  const PX=0.9, H=(H1-H0)*PX, hrs=[];
  for(let m=H0;m<H1;m+=60) hrs.push(m);
  let head='<div></div>', allR='<div class="wk-gut">journée</div>';
  let body=`<div class="wk-gutcol" style="height:${H}px">${hrs.map(m=>`<span class="wk-tl" style="top:${(m-H0)*PX}px">${pad(m/60)}h</span>`).join('')}</div>`;
  cols.forEach(({d,B,allday})=>{
    const dd=parseD(d);
    head+=`<button class="wk-hd ${d===tod?'today':''}" data-a="agendaDay" data-id="${d}" aria-label="${fmtLong(d)}"><small>${'LMMJVSD'[(dd.getDay()+6)%7]}</small><b>${dd.getDate()}</b></button>`;
    allR+=`<div class="wk-allday">${allday.slice(0,2).map(it=>`<span class="gm-ev ${it.k==='t'?'task':''}" ${it.c?`style="background:${esc(it.c)}"`:''}>${esc(it.o.title)}</span>`).join('')}${allday.length>2?`<span class="gm-more">+${allday.length-2}</span>`:''}</div>`;
    let cluster=[],clEnd=-1; const colsEnd=[];
    const finish=()=>{const n=Math.max(1,...cluster.map(b=>b.col+1));cluster.forEach(b=>b.n=n);cluster=[];colsEnd.length=0};
    B.forEach(b=>{if(cluster.length&&b.s>=clEnd)finish();let c=colsEnd.findIndex(e=>e<=b.s);if(c<0){c=colsEnd.length;colsEnd.push(b.e)}else colsEnd[c]=b.e;b.col=c;cluster.push(b);clEnd=Math.max(clEnd,b.e)});
    if(cluster.length) finish();
    const blocks=B.map(b=>b.k==='c'?`<div class="wk-ev cls" style="top:${(b.s-H0)*PX}px;height:${(b.e-b.s)*PX-2}px;left:calc(${b.col*100/b.n}% + 1px);width:calc(${100/b.n}% - 2px)"><b>🏫</b><small>Classe</small></div>`:`<div class="wk-ev ${b.k==='t'?'task':''}" data-drag="${b.k==='t'?'task':'ev'}" data-mode="t" data-d="${d}" data-s="${b.s}" data-dur="${b.e-b.s}" data-ppm="${PX}" data-a="${b.k==='e'?'editEvent':'editTask'}" data-id="${b.o.id}" style="top:${(b.s-H0)*PX}px;height:${Math.max(18,(b.e-b.s)*PX-2)}px;left:calc(${b.col*100/b.n}% + 1px);width:calc(${100/b.n}% - 2px);${b.c?'background:'+esc(b.c):''}"><b>${b.k==='t'?urgDot(b.o):''}${esc(b.o.title)}</b><small>${fromMin(b.s)}</small></div>`).join('');
    body+=`<div class="wk-col" data-tdrop="${d}" data-a="wkSlot" data-d="${d}" data-h0="${H0}" data-ppm="${PX}" style="height:${H}px">${hrs.map(m=>`<i class="wk-hr" style="top:${(m-H0)*PX}px"></i>`).join('')}${blocks}</div>`;
  });
  const groups=days.map(d=>{const L=agTasksOn(d);return L.length?agDayLabel(fmtLong(d),L.length)+`<div class="list">${L.map(taskRowLite).join('')}</div>`:''}).join('');
  const lists=groups?`<div class="card agcard">${groups}</div>`:'<div class="small muted agw-empty" style="margin-top:12px">Aucune tâche cette semaine</div>';
  return agendaNav('Semaine '+isoWeek(mon)+' · du '+M.getDate()+' '+MOIS_A[M.getMonth()])+`<div class="wk">${head}${allR}${body}</div>`+lists;
}
const isoWeek=d=>{const D=parseD(d),t=new Date(Date.UTC(D.getFullYear(),D.getMonth(),D.getDate())),w=t.getUTCDay()||7;t.setUTCDate(t.getUTCDate()+4-w);const y0=new Date(Date.UTC(t.getUTCFullYear(),0,1));return Math.ceil(((t-y0)/864e5+1)/7)};
function agendaMonthView(){
  const t=agCur(), D=parseD(t), first=iso(new Date(D.getFullYear(),D.getMonth(),1));
  const lead=(parseD(first).getDay()+6)%7, dim=new Date(D.getFullYear(),D.getMonth()+1,0).getDate();
  const calCol=e=>(S.settings.calendars.find(c=>c.id===e.calId)||{}).color||e.color||'var(--a1)';

  let groups=mt.length?agDayLabel('Tâches du mois · '+cap(MOIS_A[D.getMonth()]),mt.length)+`<div class="list">${mt.map(taskRowLite).join('')}</div>`:'';
  for(let n=1;n<=dim;n++){const d=addDays(first,n-1);const L=agTasksOn(d);if(L.length) groups+=agDayLabel(fmtLong(d),L.length)+`<div class="list">${L.map(taskRowLite).join('')}</div>`}
  const lists=groups?`<div class="card agcard">${groups}</div>`:'';
  return agendaNav(cap(MOIS_A[D.getMonth()])+' '+D.getFullYear())+`<div class="gm">${head}${cells}</div>`+(lists||'<div class="small muted agw-empty" style="margin-top:12px">Aucune tâche ce mois-ci</div>');
}
VIEWS.agenda=()=>{
  if(agMode!=='liste'){

    return {title:'Agenda',html:`<div style="margin-bottom:12px">${agendaModeChips()}</div>`+body,fab:'newEvent',mic:'event'};
  }
  const t=today(), from=agendaPast?addDays(t,-30):t, to=addDays(t,90), days={};

  S.events.forEach(e=>{let d=e.date,g=0;const end=e.endDate||e.date;while(d<=end&&g++<62){if(d>=from&&d<=to)add(d,{k:'e',o:e,s:e.start&&(d===e.date)?e.start:'00:00'});d=addDays(d,1)}});
  S.tasks.filter(x=>x.date&&x.time&&!x.done&&x.date>=from&&x.date<=to).forEach(x=>add(x.date,{k:'t',o:x,s:x.time}));
  const s=S.settings, pend=S.events.filter(e=>e.sync==='pending').length+S.tasks.filter(x=>x.sync==='pending').length+S.syncDeletes.length;

  } else html+=`<button class="banner" data-a="goSub" data-id="google">🔗 Connecter Google Agenda (synchro dans les 2 sens)<span class="grow"></span>→</button>`;
  html+=`<div style="margin-top:12px">${chips([['0','À venir'],['1','Avec les 30 derniers jours']],agendaPast?'1':'0','agendaPast')}</div>`;
  const keys=Object.keys(days).sort();
  if(!keys.length) html+=empty('📅','Aucun événement','Ajoutez un événement avec +, ou synchronisez Google Agenda.');

    const L=days[d].sort((a,b)=>a.s.localeCompare(b.s));
    html+=sec(fmtLong(d)+(d===t?' · aujourd\'hui':''),null)+`<div class="list">${L.map(x=>x.k==='h'?holiHTML(x.o):x.k==='e'?eventRow(x.o,d):taskRow(x.o)).join('')}</div>`;
  }
  return {title:'Agenda',html,fab:'newEvent',mic:'event'};
};

const ACC_OPEN=new Set();
function accordion(key){
  const main=$('#main'); [...main.children].filter(c=>c.classList.contains('sec')).forEach((h,i)=>{
    const id=key+i, body=document.createElement('div'); body.className='accbody';
    let n=h.nextElementSibling; while(n&&!n.classList.contains('sec')){const nx=n.nextElementSibling; body.appendChild(n); n=nx;}
    h.after(body); h.classList.add('acc-h');
    const set=()=>{const o=ACC_OPEN.has(id); h.classList.toggle('open',o); body.hidden=!o};
    set(); h.onclick=()=>{ACC_OPEN.has(id)?ACC_OPEN.delete(id):ACC_OPEN.add(id); set()};
  });
}

let sheetCtx={}, sheetOpen=false, ignorePop=false;

let sheetQuiet=false;
function openSheet(title,body,opt={}){
  const sh=$('#sheet'); body=body.replace(/\sautofocus\b/g,' data-af');
  sh.innerHTML=`<div class="grab"></div><div class="sh-head"><h2>${esc(title)}</h2>${opt.headSave?'<button type="button" class="btn sm primary sh-save" data-a="sheetSave">Enregistrer</button>':''}<button type="button" class="icon-btn sm" data-a="closeSheet" aria-label="Fermer">✕</button></div><form id="shForm" autocomplete="off">${body}${opt.onSave||opt.onDelete?`<div class="sh-foot">${opt.onDelete?'<button type="button" class="btn ghost danger" data-a="sheetDelete">Supprimer</button>':''}${opt.onSave?`<button class="btn primary">${opt.saveLabel||'Enregistrer'}</button>`:''}</div>`:''}</form>`;
  sheetCtx=opt;
  $('#shForm').onsubmit=e=>{e.preventDefault();const fd=Object.fromEntries(new FormData(e.target));if(sheetCtx.onSave&&sheetCtx.onSave(fd)!==false)closeSheet()};
  const w=$('#sheetWrap'); w.classList.remove('hidden'); requestAnimationFrame(()=>requestAnimationFrame(()=>w.classList.add('open')));
  if(!sheetOpen) history.pushState({sheet:1},'');
  sheetOpen=true;
  const af=sh.querySelector('[data-af]'); if(af&&!sheetQuiet) setTimeout(()=>af.focus(),260); sheetQuiet=false;
}
function hideSheet(){sheetOpen=false;const w=$('#sheetWrap');w.classList.remove('open');setTimeout(()=>{if(!sheetOpen)w.classList.add('hidden')},230)}
function closeSheet(){if(!sheetOpen)return;hideSheet();if(history.state&&history.state.sheet){ignorePop=true;history.back()}}

function markPending(o,kind){
  o.updatedAt=Date.now();
  if(kind==='event'){ if(!o.readonly) o.sync='pending'; }
  else if(kind==='task'){ if((S.settings.pushTasks&&!o.noSync&&o.date)||o.gid) o.sync='pending'; }
  else if(kind==='rem'){ if((remG(o)&&!(o.recur==='none'&&o.done))||o.gid) o.sync='pending'; }
  queueSync();
}
function removeUndo(key,obj,label){
  const arr=S[key], i=arr.indexOf(obj); if(i<0) return;
  arr.splice(i,1);
  let del=null;
  if(obj.gid&&!obj.readonly){del={calId:obj.calId||S.settings.targetCal,gid:obj.gid};S.syncDeletes.push(del);queueSync()}
  save(); render();
  toast(label+' supprimé','Annuler',()=>{
    S[key].splice(Math.min(i,S[key].length),0,obj);
    if(del){ if(S.syncDeletes.includes(del)) S.syncDeletes=S.syncDeletes.filter(d=>d!==del); else {obj.gid=null;obj.sync='pending'} }
    save(); render();
  });
}

  const f=$('#shForm'), val=n=>{const c=f.querySelector(`[name=${n}]:checked`);return c?c.value:''};

    fld('Photos',imgBoxHTML(isNew?'title':''))+

    (x&&x.noSync?`<label class="srow"><span class="grow small">Ne plus synchroniser avec Google (supprimée de l'agenda)</span><input type="checkbox" class="sw" name="noSync" checked></label>`:''),
    {onSave(fd){

async function scanIsbnFile(f){
  try{
    const bd=new BarcodeDetector({formats:['ean_13','ean_8','upc_a','upc_e']});
    const codes=await bd.detect(await createImageBitmap(f));
    const code=(codes.map(c=>c.rawValue).find(v=>/^97[89]\d{10}$/.test(v)))||(codes[0]&&codes[0].rawValue);
    if(!code){toast('Code-barres non lu : rapprochez-vous et réessayez');return}
    toast('🔎 Recherche du livre '+code+'…');
    let title=null,auth=null;
    try{const r=await fetch('https://www.googleapis.com/books/v1/volumes?q=isbn:'+code).then(r=>r.json());const v=r.items&&r.items[0]&&r.items[0].volumeInfo;if(v){title=v.title+(v.subtitle?' – '+v.subtitle:'');auth=(v.authors||[]).join(', ')}}catch(e){}
    if(!title){try{const o=await fetch('https://openlibrary.org/isbn/'+code+'.json').then(r=>r.ok?r.json():null);if(o)title=o.title}catch(e){}}
    if(!title){toast('Livre introuvable (ISBN '+code+')');return}
    const ti=$('#sheet input[name=title]'),no=$('#sheet input[name=note]');
    if(ti) ti.value=title; if(no&&auth&&!no.value) no.value=auth;
    toast('📖 '+title);
  }catch(e){toast('⚠️ Scan impossible : '+e.message)}
}

  const segs=text.normalize('NFC').split(/\n+|;|(?<=[.!?])\s+(?=\S)|\s+(?:puis|ensuite|et aussi|et puis)\s+/i)
    .map(s=>s.trim().replace(/^(?:[-•*]|\d+[.)])\s*/,'').trim()).filter(s=>s.length>1);

/* ================= Dictée vocale ================= */
let recFolder=null, rec=null, recOn=false, recWant=false, recBuf='', recInterim='', recMode='jour', recTimer=null;
const SRc=()=>window.SpeechRecognition||window.webkitSpeechRecognition;
const cleanDict=s=>s.replace(/[ \t]*(?<![\wÀ-ÿ])(?:point à la ligne|retour à la ligne|nouvelle ligne|à la ligne|a la ligne)(?![\wÀ-ÿ])[ \t]*/gi,'\n').replace(/[ \t]*(?<![\wÀ-ÿ])point virgule(?![\wÀ-ÿ])[ \t]*/gi,' ; ').replace(/[ \t]+/g,' ').replace(/\n\s*\n+/g,'\n');
function showLive(){
  const t=cleanDict(recBuf+recInterim);
  if(recMode==='notes'){const el=$('#noteText');if(el){el.value=t;S.draft=t}}
  else{const el=$('#dictLive');if(el){el.textContent=t.trim()||'…';el.scrollTop=el.scrollHeight}}
}
function recSession(){
  const SR=SRc(); rec=new SR(); rec.lang='fr-FR'; rec.interimResults=true; rec.continuous=!/Android/i.test(navigator.userAgent);
  rec.onresult=e=>{let interim='';for(let i=e.resultIndex;i<e.results.length;i++){const r=e.results[i];if(r.isFinal)recBuf+=r[0].transcript.trim()+' ';else interim+=r[0].transcript}recInterim=interim;showLive()};
  rec.onerror=ev=>{
    if(['not-allowed','service-not-allowed','audio-capture'].includes(ev.error)){recWant=false;toast('🎙️ Micro refusé : autorisez-le dans les réglages de Chrome')}
    else if(ev.error==='network'){recWant=false;toast('La dictée nécessite une connexion internet')}
  };
  rec.onend=()=>{ if(recInterim){recBuf+=recInterim.trim()+' ';recInterim=''} if(recBuf.trim()) recBuf=recBuf.trimEnd()+' '; if(recWant){try{recSession()}catch(e){finishRec()}} else finishRec(); };
  rec.start();
}
function micStart(mode){
  if(!SRc()){toast('Dictée indisponible : ouvrez l\'app dans Chrome');return}
  recMode=mode; recFolder=todoFolder; recWant=true; recInterim='';
  const ta=$('#noteText'); recBuf=mode==='notes'&&ta&&ta.value.trim()?ta.value.replace(/\s*$/,'\n'):'';
  try{recSession()}catch(e){toast('Dictée : '+e.message);return}
  recOn=true; clearTimeout(recTimer); recTimer=setTimeout(micStop,180000);
  if(navigator.vibrate) navigator.vibrate(15);
  render();
}
function micStop(){ recWant=false; clearTimeout(recTimer); if(rec){try{rec.stop()}catch(e){finishRec()}} else finishRec(); }
function finishRec(){
  if(!recOn) return;
  recOn=false; rec=null;
  const text=cleanDict(recBuf+recInterim).trim(); recBuf=''; recInterim='';
  if(recMode==='notes'){S.draft=text;save();render();return}
  if(recMode==='task'&&text){
    const props=parseNote(text), before=new Set(S.tasks.map(x=>x.id));
    props.forEach(p=>{p.type='task';applyProp(p)}); const ids=S.tasks.filter(x=>!before.has(x.id)).map(x=>x.id);
    save(); render(); toast(`✅ ${plural(ids.length,'tâche ajoutée','tâches ajoutées')}`,'Annuler',()=>{S.tasks=S.tasks.filter(x=>!ids.includes(x.id));save();render()}); return;
  }
  if(recMode==='event'&&text){
    const props=parseNote(text), before=new Set(S.events.map(x=>x.id));
    props.forEach(p=>{p.type='event';if(!p.date)p.date=today();applyProp(p)}); const ids=S.events.filter(x=>!before.has(x.id)).map(x=>x.id);
    save(); render(); toast(`📅 ${plural(ids.length,'événement ajouté','événements ajoutés')}`,'Annuler',()=>{S.events=S.events.filter(x=>!ids.includes(x.id));save();render()}); return;
  }
  if(recMode==='item'&&text){
    const lines=text.split(/\n+/).map(x=>cap(x.trim().replace(/[\s.,;]+$/,''))).filter(Boolean);
    const ids=lines.map(l=>{const o={id:uid(),folderId:recFolder,text:l,done:false,images:[],created:Date.now()};S.items.push(o);return o.id});
    save(); render(); toast(`📝 ${plural(ids.length,'élément ajouté','éléments ajoutés')}`,'Annuler',()=>{S.items=S.items.filter(x=>!ids.includes(x.id));save();render()}); return;
  }

}
function analyzeText(text){
  const props=parseNote(text);
  if(!props.length){toast('Je n\'ai rien trouvé à ranger');return false}
  S.notes.unshift({id:uid(),text,created:Date.now(),status:'review',props}); save(); render();
  toast(`✨ ${plural(props.length,'élément détecté','éléments détectés')} : vérifiez et validez`);

const isReadonly=id=>{const c=S.settings.calendars.find(c=>c.id===id);return !!c&&['reader','freeBusyReader'].includes(c.role)};
function gTime(date,time){return {dateTime:`${date}T${time}:00`,timeZone:TZ}}

const validD=d=>/^\d{4}-\d{2}-\d{2}$/.test(d||'');
function gEventBody(e){

  if(e.start){const et=e.end&&(e.end>e.start||(e.endDate&&e.endDate>e.date))?e.end:fromMin(Math.min(toMin(e.start)+60,1439));b.start=gTime(e.date,e.start);b.end=gTime(e.endDate||e.date,et)}

}
function gTaskBody(x){

}
function gRemBody(r){

  const b={summary:'🔔 '+r.title,description:'Rappel Thêta',start:gTime(d,st),end:gTime(d,fromMin(Math.min(toMin(st)+15,1439))),transparency:'transparent',

function fromG(g){

function queueSync(){

async function sync(interactive){
  if(syncing) return;
  if(!S.settings.clientId){if(interactive){toast('Configurez d\'abord Google Agenda');sub='google';render()}return}
  if(!navigator.onLine){if(interactive)toast('Hors ligne : synchronisation reportée');return}
  syncing=true; $$('[data-a=sync] span').forEach(s=>s.classList.add('spin'));
  let up=0,down=0,failed=[];
  try{
    await getToken(interactive);
    if(!S.settings.calendars.length) await loadCalendars();
    const target=S.settings.targetCal;
    // 1. suppressions
    for(const d of S.syncDeletes.slice()){ if(!isReadonly(d.calId)) await gapi('DELETE',`/calendars/${enc(d.calId)}/events/${enc(d.gid)}`); S.syncDeletes=S.syncDeletes.filter(x=>x!==d); up++; }
    save();
    // 2. envoi des événements
    for(const e of S.events.filter(e=>e.sync==='pending')){
      const cal=e.calId||target; if(isReadonly(cal)){e.sync='ok';continue}
      if(!validD(e.date)){failed.push(e.title);continue}
      if(e.start&&!validHM(e.start)) e.start=''; if(e.end&&!validHM(e.end)) e.end='';
      try{
        const r=e.gid?await gapi('PATCH',`/calendars/${enc(cal)}/events/${enc(e.gid)}`,forPatch(gEventBody(e))):await gapi('POST',`/calendars/${enc(cal)}/events`,gEventBody(e));
        if(r){e.gid=r.id;e.gUpdated=r.updated} e.calId=cal; e.sync='ok'; delete e.syncErr; up++; save();
      }catch(err){ if(err.message==='auth') throw err; e.syncErr=err.message; failed.push(e.title); }
    }
    // 3. envoi des tâches
    for(const x of S.tasks.filter(x=>x.sync==='pending')){
      const cal=x.calId||target;
      if(!x.date||x.noSync||!S.settings.pushTasks){ if(x.gid){await gapi('DELETE',`/calendars/${enc(cal)}/events/${enc(x.gid)}`);x.gid=null;up++} x.sync=null; continue; }
      if(!validD(x.date)){failed.push(x.title);continue}
      if(x.time&&!validHM(x.time)) x.time='';
      try{
        const r=x.gid?await gapi('PATCH',`/calendars/${enc(cal)}/events/${enc(x.gid)}`,forPatch(gTaskBody(x))):await gapi('POST',`/calendars/${enc(cal)}/events`,gTaskBody(x));
        if(r){x.gid=r.id;x.gUpdated=r.updated} x.calId=cal; x.sync='ok'; delete x.syncErr; up++; save();
      }catch(err){ if(err.message==='auth') throw err; x.syncErr=err.message; failed.push(x.title); }
    }
    // 3 bis. envoi des rappels (alerte sur le téléphone via Google Agenda)
    S.reminders.forEach(r=>{if(remG(r)&&!r.gid&&!r.sync&&!(r.recur==='none'&&(r.done||r.date<today())))r.sync='pending'});
    for(const r of S.reminders.filter(r=>r.sync==='pending')){
      const cal=r.calId||target, want=remG(r)&&!(r.recur==='none'&&r.done);
      try{
        if(!want){ if(r.gid){await gapi('DELETE',`/calendars/${enc(cal)}/events/${enc(r.gid)}`);r.gid=null;up++} r.sync=null; continue; }
        const b=gRemBody(r); let res;
        if(r.gid){ if(!b.recurrence) b.recurrence=[]; res=await gapi('PATCH',`/calendars/${enc(cal)}/events/${enc(r.gid)}`,forPatch(b)); }
        else res=await gapi('POST',`/calendars/${enc(cal)}/events`,b);
        if(res) r.gid=res.id; r.calId=cal; r.sync='ok'; up++; save();
      }catch(err){ if(err.message==='auth') throw err; failed.push(r.title); }
    }
    // 4. réception depuis Google (incrémentale : seulement ce qui a changé depuis la dernière synchro)
    const incr=!interactive&&S.settings.lastFullSync&&S.settings.lastSync&&Date.now()-S.settings.lastFullSync<12*36e5;
    const tMin=new Date();tMin.setDate(tMin.getDate()-30);tMin.setHours(0,0,0,0);
    const tMax=new Date();tMax.setDate(tMax.getDate()+120);
    const minD=iso(tMin),maxD=iso(tMax);
    for(const c of S.settings.calendars.filter(c=>c.import)){
      const list=[];let page=null,g=0;
      do{const q=new URLSearchParams({timeMin:tMin.toISOString(),timeMax:tMax.toISOString(),singleEvents:'true',maxResults:'2500'});if(incr){q.set('updatedMin',new Date(S.settings.lastSync-10*60e3).toISOString());q.set('showDeleted','true')}if(page)q.set('pageToken',page);
        const r=await gapi('GET',`/calendars/${enc(c.id)}/events?${q}`);list.push(...(r.items||[]));page=r.nextPageToken}while(page&&g++<10);
      const seen=new Set();

        if(ge.status==='cancelled'){ if(incr){ const n0=S.events.length; S.events=S.events.filter(e=>!(e.gid===ge.id&&e.sync!=='pending')); down+=n0-S.events.length; S.tasks.forEach(x=>{if(x.gid===ge.id&&x.sync!=='pending'){x.gid=null;x.sync=null;x.noSync=true}}); } continue; }
        if(!ge.start) continue;
        seen.add(ge.id);
        const mo=ge.extendedProperties&&ge.extendedProperties.private;
        if(mo&&mo.moType==='reminder') continue;
        if(mo&&mo.moType==='task'){
          const x=S.tasks.find(x=>x.gid===ge.id);
          if(x&&x.sync!=='pending'&&ge.updated!==x.gUpdated){const f=fromG(ge);x.title=(ge.summary||'').replace(/^(?:✅|✔️|✔|☑️)\s*/u,'')||x.title;x.date=f.date;x.time=f.start||'';if(f.start&&f.end)x.duration=Math.max(5,toMin(f.end)-toMin(f.start));const wasDone=x.done;x.done=/^✔/.test(ge.summary||'');if(x.done&&!wasDone)x.doneAt=Date.now();x.gUpdated=ge.updated;down++}
          continue;
        }

        if(e&&e.gUpdated===ge.updated) continue;
        if(!e){e={id:uid(),gid:ge.id,source:'google',created:Date.now()};S.events.push(e)}
        const f=fromG(ge);
        Object.assign(e,{title:ge.summary||'(Sans titre)',date:f.date,endDate:f.endDate,start:f.start,end:f.end,place:ge.location||'',notes:(ge.description||'').replace(/<[^>]+>/g,' ').trim(),calId:c.id,calName:c.name,color:c.color,sync:'ok',gUpdated:ge.updated,readonly:['reader','freeBusyReader'].includes(c.role)});
        down++;
      }
      if(incr) continue;
      const before=S.events.length;
      S.events=S.events.filter(e=>!(e.gid&&e.calId===c.id&&e.sync!=='pending'&&e.date>=minD&&e.date<=maxD&&!seen.has(e.gid)));

    if(S.settings.driveSync&&hasDrive()){ try{ down+=await driveSync() }catch(err){ if(err.message==='auth') throw err; console.warn(err) } }

    if(err.message==='auth'){ if(interactive) toast('Session Google expirée : reconnectez-vous'); }
    else toast('⚠️ '+err.message);
  }finally{ syncing=false; save(); if(!sheetOpen) render(); }
}

let mapsP=null, placeTok=null, placeT=null;

function loadMaps(){
  const k=(S.settings.mapsKey||'').trim(); if(!k) return Promise.reject(new Error('Pas de clé Maps'));
  if(window.google&&google.maps&&google.maps.importLibrary) return Promise.resolve();
  if(mapsP) return mapsP;
  mapsP=new Promise((res,rej)=>{window.__thetaMaps=()=>res();const sc=document.createElement('script');sc.src=`https://maps.googleapis.com/maps/api/js?key=${enc(k)}&loading=async&language=fr&region=FR&callback=__thetaMaps`;sc.async=true;sc.onerror=()=>{mapsP=null;sc.remove();rej(new Error('Google Maps injoignable'))};document.head.appendChild(sc)});

async function placeSuggest(q){
  const box=$('#placeSug'); if(!box) return;
  if(q.trim().length<3){box.innerHTML='';return}
  try{
    await loadMaps();
    const {AutocompleteSuggestion,AutocompleteSessionToken}=await google.maps.importLibrary('places');
    placeTok=placeTok||new AutocompleteSessionToken();
    const {suggestions}=await AutocompleteSuggestion.fetchAutocompleteSuggestions({input:q,sessionToken:placeTok,language:'fr',region:'fr'});
    const L=(suggestions||[]).map(x=>x.placePrediction).filter(Boolean).slice(0,5);
    if(!$('#placeSug')) return;
    $('#placeSug').innerHTML=L.map(pp=>{const main=(pp.mainText&&pp.mainText.text)||pp.text.text, sec2=(pp.secondaryText&&pp.secondaryText.text)||'';return `<button type="button" data-a="pickPlace" data-v="${esc(pp.text.text)}">📍 <span class="grow"><b>${esc(main)}</b><small>${esc(sec2)}</small></span></button>`}).join('');
  }catch(e){ const b=$('#placeSug'); if(b) b.innerHTML=`<div class="small muted">Suggestions indisponibles (${esc(e.message)})</div>`; }
}

const DRIVE='https://www.googleapis.com/drive/v3', DRIVE_UP='https://www.googleapis.com/upload/drive/v3', DRIVE_NAME='Thêta - sauvegarde.json';
async function gfetch(url,opt={}){
  const tok=await getToken(false);
  const r=await fetch(url,{...opt,headers:{Authorization:'Bearer '+tok,...(opt.headers||{})}});
  if(r.status===401){gTok=null;localStorage.removeItem('theta_v2_gtok');throw new Error('auth')}

/* ---- Synchro des données entre appareils (fichier partagé sur Google Drive) ---- */
const SYNC_NAME='Thêta - synchro.json';
const SYNC_COLLS=['tasks','events','items','notes','reminders','habits','ideas','loans','folders'];
const SYNC_PREFS=['classDays','classStart','classEnd','lunchFree','lunchStart','lunchEnd','directionDays','dechargeKw','zone','dayStart','dayEnd','defaultDuration'];
const SKIP_KEYS=new Set(['updatedAt','sync','syncErr','gUpdated']);
const recKey=r=>JSON.stringify(r,(k,v)=>SKIP_KEYS.has(k)?undefined:v);
const prefPick=()=>{const o={};SYNC_PREFS.forEach(k=>o[k]=S.settings[k]);o.loanPlaces=S.loanPlaces;return o};
let SNAP=null;
function snapAll(){SNAP={};for(const c of SYNC_COLLS)for(const r of (S[c]||[]))SNAP[c+':'+r.id]=recKey(r);SNAP._prefs=JSON.stringify(prefPick())}
// Date chaque élément modifié et mémorise les suppressions (appelé à chaque enregistrement)
function stamp(){
  if(!SNAP){snapAll();return false}
  const now=Date.now(), seen=new Set(); let ch=false; S.tomb=S.tomb||{};
  for(const c of SYNC_COLLS)for(const r of (S[c]||[])){const k=c+':'+r.id, h=recKey(r); seen.add(k); if(SNAP[k]!==h){SNAP[k]=h;r.updatedAt=now;ch=true;delete S.tomb[k]}}
  for(const k in SNAP) if(k!=='_prefs'&&!seen.has(k)){delete SNAP[k];S.tomb[k]=now;ch=true}
  const ph=JSON.stringify(prefPick()); if(SNAP._prefs!==ph){SNAP._prefs=ph;S.settings.prefAt=now;ch=true}
  for(const k in S.tomb) if(now-S.tomb[k]>90*864e5) delete S.tomb[k];
  return ch;
}
const syncPayload=()=>{const data={};SYNC_COLLS.forEach(c=>data[c]=S[c]||[]);return {app:'theta-sync',v:1,at:Date.now(),data,tomb:S.tomb||{},prefs:prefPick(),prefAt:S.settings.prefAt||0}};
// Fusionne le fichier distant : pour chaque élément, la version la plus récente gagne ; les suppressions sont appliquées
function folderMap(R){
  const L=S.folders||[], Lids=new Set(L.map(f=>f.id)), Rids=new Set(R.map(f=>f.id));
  const path=(arr,f)=>{const p=[];let g=0;while(f&&g++<30){p.unshift(norm(f.name||''));f=arr.find(x=>x.id===f.parentId)}return p.join('/')};
  const byPath=new Map(); L.filter(f=>!Rids.has(f.id)).forEach(f=>byPath.set(path(L,f),f.id));
  const m={}; R.filter(f=>!Lids.has(f.id)).forEach(f=>{const lid=byPath.get(path(R,f)); if(lid) m[f.id]=lid});
  return m;
}
function mergeRemote(rem){
  let n=0; S.tomb=S.tomb||{}; if(!SNAP) snapAll();
  if(rem.data&&rem.data.folders){
    const m=folderMap(rem.data.folders);
    if(Object.keys(m).length){
      rem={...rem,data:{...rem.data}};
      rem.data.folders=rem.data.folders.filter(f=>!m[f.id]).map(f=>m[f.parentId]?{...f,parentId:m[f.parentId]}:f);
      rem.data.items=(rem.data.items||[]).map(i=>m[i.folderId]?{...i,folderId:m[i.folderId]}:i);
    }
  }
  for(const[k,t]of Object.entries(rem.tomb||{})) if(!((S.tomb[k]||0)>=t)) S.tomb[k]=t;
  for(const c of SYNC_COLLS){
    const L=S[c]||[], R=(rem.data&&rem.data[c])||[], Lm=new Map(L.map(r=>[r.id,r])), Rm=new Map(R.map(r=>[r.id,r]));
    const ids=[...L.map(r=>r.id),...R.filter(r=>!Lm.has(r.id)).map(r=>r.id)], res=[];
    for(const id of ids){
      const l=Lm.get(id), r=Rm.get(id), k=c+':'+id;
      let w=l;
      if(r&&(!l||(r.updatedAt||0)>(l.updatedAt||0))){ w={...r}; if(w.sync==='pending') w.sync=w.gid?'ok':null; delete w.syncErr; }
      const ts=S.tomb[k];
      if(ts&&ts>=(w.updatedAt||w.created||0)){ if(l) n++; delete SNAP[k]; continue; }
      if(w!==l){ n++; SNAP[k]=recKey(w); }
      res.push(w);
    }
    S[c]=res;
  }
  // Un même événement Google importé séparément sur chaque appareil : on n'en garde qu'un
  const g=new Set(); S.events=S.events.filter(e=>{if(!e.gid)return true;const k=(e.calId||'')+'|'+e.gid;if(g.has(k))return false;g.add(k);return true});
  if(rem.prefs&&(rem.prefAt||0)>(S.settings.prefAt||0)){ const{loanPlaces,...p}=rem.prefs; Object.assign(S.settings,p); if(loanPlaces) S.loanPlaces=loanPlaces; S.settings.prefAt=rem.prefAt; SNAP._prefs=JSON.stringify(prefPick()); n++; }
  return n;
}
async function driveSync(){

  if(!id){const q=new URLSearchParams({q:`name='${SYNC_NAME}' and trashed=false`,orderBy:'modifiedTime desc',fields:'files(id)'});const r=await gfetch(`${DRIVE}/files?${q}`);id=r.files&&r.files[0]&&r.files[0].id}
  if(id){try{rem=await gfetch(`${DRIVE}/files/${enc(id)}?alt=media`)}catch(e){if(e.status===404)id=null;else throw e}}
  const n=rem&&rem.app==='theta-sync'?mergeRemote(rem):0;
  stamp(); const pay=syncPayload(), body=JSON.stringify(pay);
  const same=rem&&rem.app==='theta-sync'&&JSON.stringify({...rem,at:0})===JSON.stringify({...pay,at:0});
  if(!same){
    if(id){ await gfetch(`${DRIVE_UP}/files/${enc(id)}?uploadType=media`,{method:'PATCH',headers:{'Content-Type':'application/json'},body}); }
    else{
      const bd='theta'+Date.now(), meta={name:SYNC_NAME,mimeType:'application/json',description:'Synchronisation de Thêta entre vos appareils. Ne pas modifier.'};
      const mp=`--${bd}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify(meta)}\r\n--${bd}\r\nContent-Type: application/json\r\n\r\n${body}\r\n--${bd}--`;
      const r=await gfetch(`${DRIVE_UP}/files?uploadType=multipart&fields=id`,{method:'POST',headers:{'Content-Type':'multipart/related; boundary='+bd},body:mp});
      id=r.id;
    }
  }
  S.settings.syncFileId=id; S.settings.lastDriveSync=Date.now(); save();
  return n;
}

async function driveBackup(){

async function driveRestore(){
  let id=S.settings.driveFileId;
  if(!id){const q=new URLSearchParams({q:`name='${DRIVE_NAME}' and trashed=false`,orderBy:'modifiedTime desc',fields:'files(id,modifiedTime)'});const r=await gfetch(`${DRIVE}/files?${q}`);id=r.files&&r.files[0]&&r.files[0].id}

async function restoreData(data){
  if(!data||!data.state||!Array.isArray(data.state.tasks)) throw new Error('fichier non reconnu');
  if(!confirm(`Remplacer toutes les données actuelles par la sauvegarde du ${data.date?new Date(data.date).toLocaleString('fr-FR'):'?'} ?`)) return false;
  await IDB.clear(); for(const[k,v]of Object.entries(data.images||{})) await IDB.set(k,v);
  for(const k in imgCache) delete imgCache[k];
  S=data.state; normalizeState(); snapAll(); hasCustomBg=!!(data.images||{}).bg_custom; $('#bg').dataset.k=''; save(); sub=null; render(); toast('📂 Sauvegarde restaurée');
  return true;
}

/* ================= Rappels : notifications ================= */
async function checkReminders(){
  if(!S.settings.notif||!('Notification' in window)||Notification.permission!=='granted') return;
  const t=today(), now=hhmm(new Date()); let changed=false;
  for(const r of remindersOn(t)){
    if(r.time&&r.time<=now&&r.notified!==t&&!remDone(r,t)){
      r.notified=t; changed=true;
      try{const reg=navigator.serviceWorker&&await navigator.serviceWorker.getRegistration();if(reg)reg.showNotification('🔔 '+r.title,{body:'Rappel de '+r.time,icon:'icon-192.png',badge:'icon-192.png',tag:r.id});else new Notification('🔔 '+r.title,{body:'Rappel de '+r.time})}catch(e){}
    }
  }
  if(changed) save();
}

/* ================= Glisser-déposer (fluide) ================= */
const DND={s:null,timer:null,suppress:false,x:0,y:0};
/* Déplacer un événement ou une tâche en le faisant glisser (agendas) */
const TD={el:null,on:false,timer:null,x:0,y:0,dy:0,until:0};
document.addEventListener('pointerdown',e=>{
  const el=e.target.closest('[data-drag]'); if(!el||e.button>0) return;
  TD.el=el; TD.on=false; TD.x=e.clientX; TD.y=e.clientY; TD.dy=0;
  clearTimeout(TD.timer);
  TD.timer=setTimeout(()=>{ if(!TD.el) return; TD.on=true; TD.el.classList.add('td-drag'); if(navigator.vibrate) navigator.vibrate(12); },320);
});
document.addEventListener('pointermove',e=>{
  if(!TD.el) return;
  if(!TD.on){ if(Math.hypot(e.clientX-TD.x,e.clientY-TD.y)>8){ clearTimeout(TD.timer); TD.el=null } return }
  TD.dy=e.clientY-TD.y; TD.el.style.transform=`translate(${e.clientX-TD.x}px,${TD.dy}px)`;
});
document.addEventListener('pointerup',e=>{
  clearTimeout(TD.timer);
  const el=TD.el, on=TD.on; TD.el=null; TD.on=false;
  if(!el||!on) return;
  el.classList.remove('td-drag'); el.style.transform='';
  TD.until=performance.now()+450;
  tdApply(el,e);
});
document.addEventListener('pointercancel',()=>{ clearTimeout(TD.timer); TD.el=null; TD.on=false; });
function tdApply(el,e){
  const kind=el.dataset.drag, id=el.dataset.id, mode=el.dataset.mode, d0=el.dataset.d, dur=+el.dataset.dur||60;
  const under=document.elementFromPoint(e.clientX,e.clientY), tgt=under&&under.closest('[data-tdrop]');
  const d1=tgt?tgt.dataset.tdrop:d0;
  let s1=null;
  if(mode==='t'){
    const dm=Math.round(TD.dy/(+el.dataset.ppm||1)/15)*15;
    if(dm===0&&d1===d0) return;
    s1=Math.max(0,Math.min(1440-dur,(+el.dataset.s)+dm));
  } else if(d1===d0) return;
  const dayDiff=Math.round((parseD(d1)-parseD(d0))/864e5);
  if(kind==='ev'){
    const ev=S.events.find(x=>x.id===id); if(!ev) return;
    if(ev.readonly){ toast('🔒 Agenda en lecture seule'); return }
    ev.date=d1; if(ev.endDate) ev.endDate=addDays(ev.endDate,dayDiff);
    if(s1!==null){ ev.start=fromMin(s1); ev.end=fromMin(Math.min(s1+dur,1439)); }
    markPending(ev,'event');
  } else {
    const x=S.tasks.find(t=>t.id===id); if(!x) return;
    x.date=d1; if(s1!==null) x.time=fromMin(s1);
    markPending(x,'task');
  }
  save(); render(); toast('↔️ Déplacé');
}
function sortable(container,sel,onEnd){
  if(!container) return;
  if(getComputedStyle(container).position==='static') container.style.position='relative';
  container.addEventListener('pointerdown',e=>{
    const el=e.target.closest(sel); if(!el||!container.contains(el)||e.button>0) return;
    const handle=e.target.closest('.handle');
    if(!handle&&e.target.closest('.chk,input,textarea,select,img,a,.pill,.subx,.subadd,.sub')) return;
    DND.x=e.clientX;DND.y=e.clientY;clearTimeout(DND.timer);
    const start=()=>{DND.timer=null;DND.s={el,sel,onEnd,parent:el.parentNode,sx:DND.x,sy:DND.y,px:DND.x,py:DND.y,ox:el.offsetLeft,oy:el.offsetTop,sc:scrollY};
      el.classList.add('dragging');el.style.transition='none';if(navigator.vibrate)navigator.vibrate(12)};
    if(handle){e.preventDefault();start()} else DND.timer=setTimeout(start,380);
  });
}
function dndPlace(){const s=DND.s;const dx=s.px-s.sx-(s.el.offsetLeft-s.ox), dy=s.py-s.sy+(scrollY-s.sc)-(s.el.offsetTop-s.oy);s.el.style.transform=`translate(${dx}px,${dy}px) scale(1.03)`}
function dndMove(){
  const s=DND.s; if(!s) return;
  const w=s.el.offsetWidth,hh=s.el.offsetHeight, cx=s.ox+(s.px-s.sx)+w/2, cy=s.oy+(s.py-s.sy)+(scrollY-s.sc)+hh/2;
  const sibs=[...s.parent.children].filter(c=>c!==s.el&&c.matches(s.sel));
  const target=sibs.find(c=>cx>c.offsetLeft&&cx<c.offsetLeft+c.offsetWidth&&cy>c.offsetTop+c.offsetHeight*.2&&cy<c.offsetTop+c.offsetHeight*.8);
  if(target){
    const all=[...s.parent.children], after=all.indexOf(target)>all.indexOf(s.el);
    const first=new Map(sibs.map(c=>[c,[c.offsetLeft,c.offsetTop]]));
    s.parent.insertBefore(s.el,after?target.nextSibling:target);
    sibs.forEach(c=>{const[a,b]=first.get(c),dx=a-c.offsetLeft,dy=b-c.offsetTop;if(dx||dy){c.style.transition='none';c.style.transform=`translate(${dx}px,${dy}px)`;void c.offsetWidth;c.style.transition='transform .2s cubic-bezier(.2,.8,.2,1)';c.style.transform=''}});
  }
  dndPlace();
}
window.addEventListener('pointermove',e=>{
  if(DND.timer&&!DND.s&&Math.hypot(e.clientX-DND.x,e.clientY-DND.y)>10){clearTimeout(DND.timer);DND.timer=null}
  if(!DND.s) return; DND.s.px=e.clientX; DND.s.py=e.clientY; dndMove();
  if(e.clientY<90) scrollBy(0,-9); else if(e.clientY>innerHeight-140) scrollBy(0,9);
},{passive:true});
window.addEventListener('scroll',()=>{if(DND.s)dndMove()},{passive:true});

const endDrag=()=>{clearTimeout(DND.timer);DND.timer=null;if(!DND.s)return;const s=DND.s;DND.s=null;
  s.el.style.transition='transform .2s cubic-bezier(.2,.8,.2,1)';s.el.style.transform='';setTimeout(()=>{s.el.classList.remove('dragging');s.el.style.transition=''},210);
  DND.suppress=true;setTimeout(()=>DND.suppress=false,400);s.onEnd([...s.parent.children].filter(c=>c.matches(s.sel)).map(c=>c.dataset.id))};

/* ================= Glisser entre les jours (suit le doigt) ================= */
let SW=null, sliding=false;
function slideTo(dir,apply){
  const m=$('#main'); if(sliding) return; sliding=true;
  m.style.transition='transform .14s ease-in, opacity .14s'; m.style.transform=`translateX(${dir>0?-28:28}%)`; m.style.opacity='0';
  setTimeout(()=>{apply(); render(); m.style.transition='none'; m.style.transform=`translateX(${dir>0?28:-28}%)`; void m.offsetWidth;
    m.style.transition='transform .26s cubic-bezier(.2,.8,.2,1), opacity .22s'; m.style.transform=''; m.style.opacity=''; scrollTo({top:0});
    setTimeout(()=>{sliding=false;m.style.transition='';m.style.transform='';m.style.opacity=''},280)},140);
}
function goDay(n){n=Math.max(0,Math.min(6,n));if(n===jourOff)return;slideTo(n>jourOff?1:-1,()=>{jourOff=n})}
document.addEventListener('touchstart',e=>{
  if(view!=='jour'||sub||sheetOpen||DND.s||sliding||e.touches.length>1||e.target.closest('.chips,.tchips,.hchips,input,textarea,select,.prop')){SW=null;return}
  SW={x:e.touches[0].clientX,y:e.touches[0].clientY,on:false,dx:0,sy:scrollY};
},{passive:true});
document.addEventListener('touchmove',e=>{
  if(!SW||DND.s) return; const t=e.touches[0], dx=t.clientX-SW.x, dy=t.clientY-SW.y;
  if(!SW.on){ if(Math.abs(dy)>10||Math.abs(scrollY-SW.sy)>4){SW=null;return} if(Math.abs(dx)>30&&Math.abs(dx)>Math.abs(dy)*2.5){SW.on=true;SW.x+=dx>0?30:-30;$('#main').style.transition='none'} else return; }
  const dx2=t.clientX-SW.x;
  SW.dx=dx2; const edge=(jourOff===0&&dx2>0)||(jourOff===6&&dx2<0), d=edge?dx2/5:dx2*.85, m=$('#main');
  m.style.transform=`translateX(${d}px)`; m.style.opacity=String(1-Math.min(.45,Math.abs(d)/650));
},{passive:true});
const swipeEnd=cancel=>{
  if(!SW||!SW.on){SW=null;return} const dx=SW.dx; SW=null; const n=jourOff+(dx<0?1:-1);
  if(!cancel&&Math.abs(dx)>Math.max(90,innerWidth*.28)&&n>=0&&n<=6) slideTo(dx<0?1:-1,()=>{jourOff=n});
  else{const m=$('#main');m.style.transition='transform .22s cubic-bezier(.2,.8,.2,1), opacity .2s';m.style.transform='';m.style.opacity='';setTimeout(()=>{if(!sliding)m.style.transition=''},240)}
};
document.addEventListener('touchend',()=>swipeEnd(false),{passive:true});

/* ================= Toast ================= */
let toastT;
function toast(msg,btn,fn){
  const el=$('#toast'); el.innerHTML=`<span>${esc(msg)}</span>${btn?`<button>${esc(btn)}</button>`:''}`;
  if(btn) el.querySelector('button').onclick=()=>{el.classList.remove('show');fn()};
  el.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>el.classList.remove('show'),btn?5500:2600);
}

/* ================= Vacances scolaires (données ouvertes Éducation nationale) ================= */
const parisDay=v=>{try{return new Date(v).toLocaleDateString('en-CA',{timeZone:'Europe/Paris'})}catch(e){return iso(new Date(v))}};
async function loadHolidays(force){
  const z=S.settings.zone; if(!z||!navigator.onLine) return;
  const H=S.holidays; if(!force&&H&&H.zone===z&&Date.now()-H.fetched<20*864e5) return;
  try{
    const from=addDays(today(),-60);
    const q=new URLSearchParams({limit:'100',order_by:'start_date',where:`zones="${z}" and end_date>="${from}"`});
    const r=await fetch('https://data.education.gouv.fr/api/explore/v2.1/catalog/datasets/fr-en-calendrier-scolaire/records?'+q);
    if(!r.ok) throw new Error('HTTP '+r.status);
    const j=await r.json(), seen=new Set(), list=[];
    for(const x of (j.results||[])){
      if(/enseignant/i.test(x.population||'')) continue;
      const st=parisDay(x.start_date), en=x.end_date?addDays(parisDay(x.end_date),-1):st, key=x.description+st;
      if(seen.has(key)||en<st) continue; seen.add(key);
      list.push({name:x.description,start:st,end:en});
    }
    S.holidays={zone:z,fetched:Date.now(),list}; save(); render();
    if(force) toast(`🏖️ ${plural(list.length,'période de vacances chargée','périodes de vacances chargées')} (${z})`);
  }catch(e){ if(force) toast('⚠️ Vacances scolaires indisponibles : '+e.message); }
}
const holidayOn=d=>S.settings.zone&&S.holidays&&S.holidays.zone===S.settings.zone?S.holidays.list.find(h=>h.start<=d&&h.end>=d):null;
const holiHTML=h=>`<div class="holi"><span style="font-size:22px">🏖️</span><span class="grow">${esc(h.name)}<small>${esc(S.settings.zone)} · du ${fmtLong(h.start)} au ${fmtLong(h.end)} · reprise ${fmtLong(addDays(h.end,1))}</small></span></div>`;

async function handleShared(){
  try{
    const c=await caches.open('theta-v2-share'), m=await c.match('share/meta'); if(!m) return;
    const meta=await m.json(), files=[];
    for(let i=0;i<(meta.n||0);i++){const r=await c.match('share/file'+i);if(r){const b=await r.blob();files.push(new File([b],'partage'+i,{type:b.type||'image/jpeg'}))}}
    await caches.delete('theta-v2-share');
    const ids=files.length?await storeImages(files):[];
    shareSheet((meta.text||'').trim(),ids);
  }catch(e){toast('⚠️ Partage : '+e.message)}
}

      if(fd.dest==='task'){ if(!t&&!sheetImgs.length) return false; if(!t){toast('Donnez un intitulé à la tâche');return false} const o={id:uid(),title:first,notes:t.slice(first.length).trim(),date:today(),time:'',priority:'moyenne',duration:S.settings.defaultDuration,done:false,created:Date.now(),recur:'none',images:sheetImgs.slice()}; S.tasks.push(o); markPending(o,'task'); toast('✅ Tâche créée'); }
      else if(fd.dest==='auto'&&t){ closeSheet(); if(sheetImgs.length) S.items.push({id:uid(),folderId:fd.folder||null,text:first,done:false,images:sheetImgs.slice(),created:Date.now()}); analyzeText(t); view='jour'; sub=null; save(); render(); return; }
      else { if(!t&&!sheetImgs.length) return false; S.items.push({id:uid(),folderId:fd.folder||null,text:t||'Photo partagée',done:false,images:sheetImgs.slice(),created:Date.now()}); toast('📝 Ajouté aux notes'); }
      save(); render();
    }});
  if(ids.length) refreshImgBox();
}

/* ================= Démarrage ================= */
function init(){
  load(); snapAll();
  imgURL('bg_custom').then(u=>{hasCustomBg=!!u;if(S.settings.bg==='custom'&&!u){S.settings.bg='brume';save()}applyBg()});
  const p=new URLSearchParams(location.search).get('tab');
  view=TABS[p]?p:(S.settings.tabOrder[0]||'jour');
  if(p==='notes'){view='jour'}
  render();
  if(new URLSearchParams(location.search).has('shared')){ history.replaceState(null,'',location.pathname); setTimeout(handleShared,300); }
  if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)){
    const hadCtrl=!!navigator.serviceWorker.controller; let reloaded=false;
    navigator.serviceWorker.addEventListener('controllerchange',()=>{ if(hadCtrl&&!reloaded&&!sheetOpen&&!recOn){ reloaded=true; location.reload(); } });
    navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).then(reg=>{
      reg.update().catch(()=>{});
      document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible') reg.update().catch(()=>{}); });
    }).catch(()=>{});
  }
  if(/[?&]v=/.test(location.search)) history.replaceState(null,'',location.pathname);
  if(navigator.storage&&navigator.storage.persist) navigator.storage.persist().catch(()=>{});
  if(S.settings.clientId&&navigator.onLine) loadGIS().catch(()=>{});
  setInterval(checkReminders,30000); checkReminders();
  if(tokValid()&&S.settings.autoSync) setTimeout(()=>sync(false),1200);
  // Vérifie les nouveautés toutes les 2 min 30 tant que Thêta est ouverte
  setInterval(()=>{ if(document.visibilityState==='visible'&&navigator.onLine&&tokValid()&&S.settings.autoSync&&!sheetOpen) sync(false); },150000);
  // Session Google expirée (ou presque) : on la renouvelle au toucher de la barre d'onglets, puis on synchronise
  let renewAt=0, renewOff=false;
  document.addEventListener('pointerup',e=>{
    if(!e.target.closest('#nav')) return;
    const st=S.settings; if(renewOff||st.autoRenew===false||!st.clientId||!st.autoSync||!st.lastSync||!navigator.onLine||syncing||!gAccount()) return;
    if(gTok&&gTok.exp-Date.now()>5*60e3) return;
    if(Date.now()-renewAt<45*60e3) return; renewAt=Date.now();
    getToken(true,true).then(()=>sync(false)).catch(()=>{ renewOff=true; });
  },true);
  setTimeout(()=>loadHolidays(false),2000);
  document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible'){ if(!sheetOpen&&document.activeElement.tagName!=='TEXTAREA') render(); checkReminders(); if(tokValid()&&S.settings.autoSync) sync(false); } });
  matchMedia('(prefers-color-scheme: light)').addEventListener('change',applyTheme);
}
init();
</script>
