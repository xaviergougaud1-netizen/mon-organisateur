<!doctype html>
<html lang="fr" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0c0e13">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Thêta</title>
<style>
:root{--a1:#4c6ef5;--a2:#1e3a8a;--r:18px;--navh:66px;color-scheme:dark}
html[data-theme=dark]{--bg:#0c0e13;--card:#171a22;--card2:#20242f;--card3:#2c3140;--text:#eef1f7;--muted:#959db0;--line:rgba(255,255,255,.07);--glass:rgba(23,26,34,.74);--shadow:0 8px 24px rgba(0,0,0,.4);--relief:inset 0 1px 0 rgba(255,255,255,.05);--toast:#262b38}
html[data-theme=light]{color-scheme:light;--bg:#eef1f6;--card:#fff;--card2:#f2f4f8;--card3:#e2e6ee;--text:#141821;--muted:#5d6577;--line:rgba(10,20,40,.09);--glass:rgba(255,255,255,.78);--shadow:0 8px 22px rgba(30,40,70,.10);--relief:inset 0 1px 0 rgba(255,255,255,.9);--toast:#1f2430}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text)}
body{font:15.5px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans",sans-serif;min-height:100dvh;overscroll-behavior-y:contain}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{opacity:.4}
.hidden{display:none!important}
.grow{flex:1;min-width:0}
.muted{color:var(--muted)}.small{font-size:13px}
#top{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:8px;padding:calc(env(safe-area-inset-top) + 14px) 16px 10px;background:var(--bg);max-width:720px;margin:0 auto}
body.navtop #top{padding-top:calc(env(safe-area-inset-top) + var(--navh) + 22px)}
#top h1{flex:1;margin:0;font-size:24px;font-weight:800;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#topActions{display:flex;gap:6px}
main{max-width:720px;margin:0 auto;padding:2px 16px calc(var(--navh) + 110px + env(safe-area-inset-bottom))}
body.navtop main{padding-bottom:calc(110px + env(safe-area-inset-bottom))}
/* Fond d'écran zen */
#bg{position:fixed;inset:-20px;z-index:-2;background:var(--bg) center/cover no-repeat;transition:filter .3s}
#bgVeil{position:fixed;inset:0;z-index:-1;background:var(--bg);pointer-events:none;transition:opacity .2s}
body.hasbg{background:transparent}
body.hasbg #top{background:color-mix(in srgb,var(--bg) 35%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
body.hasbg .card,body.hasbg .kpi,body.hasbg .banner{background:color-mix(in srgb,var(--card) 80%,transparent);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
body.hasbg .item{background:color-mix(in srgb,var(--card) 86%,transparent)}
body.hasbg .chip:not(.on),body.hasbg .crumb:not(.cur){background:color-mix(in srgb,var(--card) 80%,transparent)}
body.hasbg .sec{color:var(--text);opacity:.8;text-shadow:0 1px 6px color-mix(in srgb,var(--bg) 70%,transparent)}
.bgs{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:10px}
.bgt{position:relative;aspect-ratio:3/5;border-radius:14px;border:3px solid transparent;background:var(--card2) center/cover;padding:0;overflow:hidden;font-size:12.5px;font-weight:650;color:var(--muted)}
.bgt.on{border-color:var(--a1)}
.bgt span{position:absolute;left:0;right:0;bottom:0;padding:4px 2px;background:rgba(0,0,0,.45);color:#fff;font-size:11.5px}
.bgt img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.bgt.add{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;border:2px dashed var(--line)}
.range{display:flex;align-items:center;gap:10px;margin-top:12px}
.range input{flex:1;accent-color:var(--a1)}
.range b{min-width:42px;text-align:right;font-size:13px;color:var(--muted)}
/* Nav */
#nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(10px + env(safe-area-inset-bottom));width:min(560px,calc(100% - 20px));display:flex;padding:6px;border-radius:26px;background:var(--glass);-webkit-backdrop-filter:blur(18px) saturate(1.5);backdrop-filter:blur(18px) saturate(1.5);border:1px solid var(--line);box-shadow:var(--shadow);z-index:20}
body.navtop #nav{bottom:auto;top:calc(8px + env(safe-area-inset-top))}
#nav button{flex:1;min-width:0;border:0;background:none;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 0;font-size:11px;font-weight:650;position:relative}
#nav .ic{font-size:19px;line-height:30px;width:100%;max-width:56px;border-radius:16px;transition:background .2s}
#nav button.on{color:var(--text)}
#nav button.on .ic{background:linear-gradient(135deg,var(--a1),var(--a2));box-shadow:0 4px 12px color-mix(in srgb,var(--a1) 45%,transparent)}
#nav .badge{position:absolute;top:0;right:calc(50% - 26px);background:#ff5d6c;color:#fff;font-style:normal;font-size:10px;min-width:17px;height:17px;border-radius:9px;display:grid;place-items:center;padding:0 4px}
/* Generic */
.sec{margin:22px 4px 8px;font-size:12.5px;font-weight:750;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);display:flex;align-items:center;gap:8px}
.sec .n{background:var(--card3);border-radius:10px;padding:0 7px;font-size:11px;color:var(--text);letter-spacing:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow),var(--relief);padding:14px}
.list{display:flex;flex-direction:column;gap:8px}
.item{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px;box-shadow:0 2px 8px rgba(0,0,0,.12),var(--relief);user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.ttl{font-weight:600;word-break:break-word}
.ttl a{color:var(--a1)}
.item.done .ttl{text-decoration:line-through;color:var(--muted)}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px;font-size:12.5px;color:var(--muted)}
.meta:empty{display:none}
.tag{display:inline-flex;align-items:center;gap:3px;background:var(--card2);border-radius:8px;padding:1px 7px;white-space:nowrap}
.tag.late{color:#ff7d87;background:rgba(255,80,90,.13)}
.tag.sync{color:#f5a623;background:rgba(255,170,40,.13)}
.tag.ok{color:#2fbf71;background:rgba(40,200,120,.13)}
.chk{flex:none;width:26px;height:26px;border-radius:9px;border:2px solid var(--muted);background:none;display:grid;place-items:center;padding:0;transition:.15s}
.chk.round{border-radius:50%}
.chk.on{border-color:transparent;background:linear-gradient(135deg,var(--a1),var(--a2))}
.chk.on::after{content:"";width:10px;height:5px;border:2.5px solid #fff;border-top:0;border-right:0;transform:translateY(-1px) rotate(-45deg)}
.prio{width:6px;align-self:stretch;border-radius:4px;flex:none}
.p-haute{background:#ff5d6c}.p-moyenne{background:#ffab40}.p-basse{background:#3ccf86}
.btn{border:0;border-radius:14px;padding:11px 16px;font-weight:650;background:var(--card2);display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none}
.btn.primary{background:linear-gradient(135deg,var(--a1),var(--a2));color:#fff;box-shadow:0 6px 16px color-mix(in srgb,var(--a1) 35%,transparent)}
.btn.ghost{background:none;border:1px solid var(--line)}
.btn.danger{color:#ff6b78}
.btn.sm{padding:7px 12px;font-size:13.5px;border-radius:11px}
.btn.block{width:100%;margin-top:10px}
.icon-btn{flex:none;width:40px;height:40px;border-radius:13px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;font-size:17px;padding:0}
.icon-btn.sm{width:34px;height:34px;border-radius:11px;font-size:14px}
.spin{animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.fab{position:fixed;right:max(18px,calc(50% - 342px));bottom:calc(var(--navh) + 30px + env(safe-area-inset-bottom));width:58px;height:58px;border-radius:20px;border:0;background:linear-gradient(135deg,var(--a1),var(--a2));color:#fff;font-size:30px;line-height:1;box-shadow:0 10px 24px color-mix(in srgb,var(--a1) 45%,transparent);z-index:15}
body.navtop .fab{bottom:calc(24px + env(safe-area-inset-bottom))}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 14px;font-weight:600;font-size:14px}
.chip.on{background:linear-gradient(135deg,var(--a1),var(--a2));color:#fff;border-color:transparent}
.progress{height:10px;background:var(--card3);border-radius:99px;overflow:hidden}
.progress>i{display:block;height:100%;background:linear-gradient(90deg,var(--a1),var(--a2));border-radius:99px;transition:width .5s}
.hero{background:linear-gradient(135deg,var(--a1),var(--a2));color:#fff;border-radius:24px;padding:18px;box-shadow:0 12px 28px color-mix(in srgb,var(--a1) 35%,transparent)}
.hero .progress{background:rgba(255,255,255,.25)}.hero .progress>i{background:#fff}
.hero-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:14px}
.hero-date{font-size:13px;opacity:.85;font-weight:650}
.hero-hello{font-size:22px;font-weight:800;margin-top:2px}
.hero-pct{font-size:30px;font-weight:800}
.hero-sub{font-size:13.5px;opacity:.92;margin-top:8px}
.banner{display:flex;width:100%;align-items:center;gap:8px;margin-top:12px;border:1px solid var(--line);background:var(--card);border-radius:16px;padding:12px 14px;font-weight:600;text-align:left}
.empty{text-align:center;padding:30px 20px;color:var(--muted)}
.empty .big{font-size:50px;margin-bottom:6px;filter:drop-shadow(0 8px 16px rgba(0,0,0,.25))}
.empty b{display:block;color:var(--text);font-size:17px;margin-bottom:4px}
.empty.mini{padding:14px;font-size:14px}
.srow{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.srow:last-child{border-bottom:0}
.sugg .stime{font-variant-numeric:tabular-nums;font-weight:700;font-size:13px;color:var(--a1);min-width:92px}
html[data-theme=dark] .sugg .stime{color:color-mix(in srgb,var(--a1) 60%,white)}
.cdot{width:12px;height:12px;border-radius:50%;flex:none}
/* Agenda */
.evtime{min-width:48px;font-weight:700;font-size:14px;font-variant-numeric:tabular-nums}
.evtime small{display:block;font-weight:500;color:var(--muted);font-size:12px}
.evbar{width:4px;align-self:stretch;border-radius:3px;flex:none}
.status{display:flex;align-items:center;gap:10px}
/* Todo */
.crumbs{display:flex;gap:6px;overflow-x:auto;padding:2px 0 12px;scrollbar-width:none}
.crumbs::-webkit-scrollbar{display:none}
.crumb{flex:none;border:0;border-radius:999px;padding:6px 12px;background:var(--card2);font-size:13.5px;font-weight:600}
.crumb.cur{background:linear-gradient(135deg,var(--a1),var(--a2));color:#fff}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.tile{position:relative;border-radius:20px;padding:14px;min-height:96px;color:#fff;display:flex;flex-direction:column;justify-content:space-between;align-items:flex-start;box-shadow:var(--shadow),inset 0 1px 0 rgba(255,255,255,.25);user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;border:0;text-align:left}
.tile b{font-size:15.5px;line-height:1.2}
.tile small{opacity:.88;font-size:12.5px}
.tile .ic{font-size:22px}
.addbar{display:flex;gap:8px;align-items:center;padding:8px;margin-bottom:12px}
.addbar input{border:0!important;background:none!important}
.dragging{opacity:.92;transform:scale(1.03);box-shadow:0 18px 34px rgba(0,0,0,.45)!important;z-index:5;position:relative}
.handle{color:var(--muted);font-size:18px;padding:4px 2px;touch-action:none;cursor:grab}
.thumbs{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.thumbs img{width:64px;height:64px;object-fit:cover;border-radius:10px;background:var(--card2)}
.imgedit{display:flex;gap:8px;flex-wrap:wrap}
.imgedit div{position:relative}
.imgedit img{width:80px;height:80px;object-fit:cover;border-radius:12px;background:var(--card2)}
.imgedit button{position:absolute;top:-6px;right:-6px;width:24px;height:24px;border-radius:50%;border:0;background:#ff5d6c;color:#fff;font-size:12px;padding:0}
details.donebox{margin-top:14px}
details summary{cursor:pointer;color:var(--muted);font-weight:650;padding:8px 4px;list-style:none}
details summary::before{content:"▸ "}details[open] summary::before{content:"▾ "}
/* Notes */
.compose textarea{min-height:120px;border:0;background:var(--card2)}
.compose-bar{display:flex;align-items:center;gap:14px;margin-top:12px}
.mic{flex:none;width:72px;height:72px;border-radius:50%;border:0;font-size:30px;background:linear-gradient(135deg,var(--a1),var(--a2));color:#fff;box-shadow:0 10px 26px color-mix(in srgb,var(--a1) 45%,transparent)}
.mic.rec{background:linear-gradient(135deg,#ff5d6c,#c2185b);animation:pulse 1.2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,93,108,.6)}100%{box-shadow:0 0 0 22px rgba(255,93,108,0)}}
.raw{font-size:13.5px;color:var(--muted);font-style:italic;word-break:break-word}
.prop{background:var(--card2);border-radius:16px;padding:12px;margin-top:10px;border:1px solid var(--line)}
.prop.unsure{border-color:rgba(255,170,40,.55)}
.tchips{display:flex;gap:6px;overflow-x:auto;margin-bottom:8px;scrollbar-width:none}
.tchips::-webkit-scrollbar{display:none}
.tchip{flex:none;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:5px 10px;font-size:13px;font-weight:600}
.tchip.on{background:linear-gradient(135deg,var(--a1),var(--a2));color:#fff;border-color:transparent}
.pf{display:flex;flex-direction:column;gap:8px}
.pbtns{display:flex;justify-content:flex-end;gap:8px;margin-top:10px}
.warn{font-size:12.5px;color:#f5a623;margin-bottom:6px;font-weight:600}
/* Forms */
.fld{display:block;margin:10px 0}
.fld>span{display:block;font-size:12.5px;font-weight:650;color:var(--muted);margin:0 0 5px 2px}
input[type=text],input[type=date],input[type=time],input[type=number],input[type=search],input:not([type]),select,textarea{width:100%;background:var(--card2);border:1px solid var(--line);border-radius:13px;padding:10px 12px;outline:none;min-height:44px}
textarea{resize:vertical;min-height:90px}
input:focus,select:focus,textarea:focus{border-color:var(--a1)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row2 .fld{margin:4px 0}
.seg{display:flex;background:var(--card2);border-radius:13px;padding:4px;gap:4px}
.seg label{flex:1}.seg input{display:none}
.seg span{display:block;text-align:center;padding:8px 4px;border-radius:10px;font-size:13.5px;font-weight:600}
.seg input:checked+span{background:linear-gradient(135deg,var(--a1),var(--a2));color:#fff}
.sw{appearance:none;-webkit-appearance:none;width:46px;height:28px;border-radius:99px;background:var(--card3);position:relative;flex:none;transition:.2s;margin:0;cursor:pointer}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.sw:checked{background:linear-gradient(135deg,var(--a1),var(--a2))}.sw:checked::after{left:21px}
.swatches{display:flex;gap:10px;flex-wrap:wrap}
.swatches input{display:none}
.swatches span,.acc{display:block;width:38px;height:38px;border-radius:13px;border:3px solid transparent;padding:0}
.swatches input:checked+span,.acc.on{border-color:var(--text)}
/* Sheet */
#sheetWrap{position:fixed;inset:0;z-index:50}
#sheetWrap .backdrop{position:absolute;inset:0;background:rgba(0,0,0,.5);opacity:0;transition:opacity .2s}
.sheet{position:absolute;left:0;right:0;bottom:0;margin:0 auto;max-width:640px;max-height:92dvh;overflow:auto;background:var(--card);border-radius:26px 26px 0 0;padding:6px 18px calc(18px + env(safe-area-inset-bottom));transform:translateY(100%);transition:transform .22s ease-out;border:1px solid var(--line)}
#sheetWrap.open .backdrop{opacity:1}#sheetWrap.open .sheet{transform:none}
.grab{width:42px;height:5px;border-radius:9px;background:var(--card3);margin:6px auto 8px}
.sh-head{display:flex;align-items:center;gap:10px;margin-bottom:4px}
.sh-head h2{flex:1;margin:0;font-size:19px}
.sh-foot{display:flex;gap:10px;justify-content:space-between;margin-top:16px;padding-top:8px;position:sticky;bottom:calc(-18px - env(safe-area-inset-bottom));background:var(--card);padding-bottom:6px}
.sh-foot .btn.primary{margin-left:auto}
.menu{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:8px}
.menu button{border:1px solid var(--line);background:var(--card2);border-radius:18px;padding:14px 6px;display:flex;flex-direction:column;align-items:center;gap:6px;font-weight:600;font-size:13px}
.menu button span{font-size:26px}
/* Toast & viewer */
#toast{position:fixed;left:50%;transform:translate(-50%,20px);bottom:calc(var(--navh) + 34px + env(safe-area-inset-bottom));background:var(--toast);color:#fff;border-radius:14px;padding:11px 14px;display:flex;gap:14px;align-items:center;box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:.2s;z-index:60;max-width:92vw;font-size:14.5px}
body.navtop #toast{bottom:calc(30px + env(safe-area-inset-bottom))}
#toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
#toast button{background:none;border:0;color:#9db4ff;font-weight:750;padding:0}
#viewer{position:fixed;inset:0;background:rgba(0,0,0,.94);z-index:70;display:grid;place-items:center;padding:10px}
#viewer img{max-width:100%;max-height:100%;border-radius:8px}
/* Stats & habits */
.bars{display:flex;align-items:flex-end;gap:8px;height:140px;padding-top:10px}
.bars div{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end;font-size:11.5px;color:var(--muted)}
.bars i{width:100%;border-radius:8px 8px 4px 4px;background:linear-gradient(180deg,var(--a1),var(--a2));min-height:3px}
.bars b{color:var(--text);font-size:12px}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px}
.kpi b{display:block;font-size:24px}
.kpi span{font-size:12.5px;color:var(--muted)}
.habit .hrow{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.dots{display:flex;gap:6px;justify-content:space-between}
.dot{width:36px;height:36px;border-radius:11px;border:0;background:var(--card3);font-size:11px;font-weight:700;color:var(--muted);padding:0}
.dot.on{background:linear-gradient(135deg,var(--a1),var(--a2));color:#fff}
.hchips{display:flex;flex-wrap:wrap;gap:8px}
.guide ol{padding-left:20px;margin:8px 0}.guide li{margin:6px 0}
code{background:var(--card2);border-radius:6px;padding:1px 5px;font-size:13px;word-break:break-all}
</style>
</head>
<body>
<div id="bg" aria-hidden="true"></div><div id="bgVeil" aria-hidden="true"></div>
<header id="top"><button id="backBtn" class="icon-btn hidden" data-a="back" aria-label="Retour">←</button><h1 id="title">Thêta</h1><div id="topActions"></div></header>
<main id="main"></main>
<nav id="nav"></nav>
<div id="sheetWrap" class="hidden"><div class="backdrop" data-a="closeSheet"></div><div class="sheet" id="sheet"></div></div>
<div id="toast"></div>
<div id="viewer" class="hidden" data-a="closeViewer"><img alt=""></div>
<input type="file" id="fileImg" accept="image/*" multiple hidden>
<input type="file" id="fileBg" accept="image/*" hidden>
<input type="file" id="fileImport" accept="application/json,.json" hidden>
<script>
'use strict';
/* ================= Utilitaires ================= */
const VERSION='2.1.0';
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parseD=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const today=()=>iso(new Date());
const addDays=(s,n)=>{const d=parseD(s);d.setDate(d.getDate()+n);return iso(d)};
const hhmm=d=>pad(d.getHours())+':'+pad(d.getMinutes());

const norm=s=>s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[’`]/g,"'");

function fmtDate(s){ if(!s) return ''; const t=today();
  if(s===t) return "Aujourd'hui"; if(s===addDays(t,1)) return 'Demain'; if(s===addDays(t,-1)) return 'Hier';
  const d=parseD(s), diff=Math.round((d-parseD(t))/864e5);
  if(diff>1&&diff<7) return cap(JOURS[d.getDay()]);
  return cap(JOURS[d.getDay()].slice(0,3))+'. '+d.getDate()+' '+MOIS_A[d.getMonth()]+(d.getFullYear()!==new Date().getFullYear()?' '+d.getFullYear():''); }
const fmtLong=s=>{const d=parseD(s);return cap(JOURS[d.getDay()])+' '+d.getDate()+' '+MOIS_A[d.getMonth()]};
const fmtDur=m=>{m=+m;return m<60?m+' min':Math.floor(m/60)+' h'+(m%60?' '+pad(m%60):'')};

/* Images : IndexedDB (bien plus de place que localStorage) */
const IDB={db:null,
  open(){return this.db?Promise.resolve(this.db):new Promise((res,rej)=>{const r=indexedDB.open('mo_images',1);r.onupgradeneeded=()=>r.result.createObjectStore('img');r.onsuccess=()=>{this.db=r.result;res(this.db)};r.onerror=()=>rej(r.error)})},
  async run(mode,fn){const db=await this.open();return new Promise((res,rej)=>{const t=db.transaction('img',mode);const r=fn(t.objectStore('img'));t.oncomplete=()=>res(r&&r.result);t.onerror=()=>rej(t.error)})},
  get(k){return this.run('readonly',s=>s.get(k))},
  set(k,v){return this.run('readwrite',s=>s.put(v,k))},
  del(k){return this.run('readwrite',s=>s.delete(k))},
  clear(){return this.run('readwrite',s=>s.clear())},
  async all(){const db=await this.open();return new Promise((res,rej)=>{const out={};const c=db.transaction('img').objectStore('img').openCursor();c.onsuccess=()=>{const cur=c.result;if(cur){out[cur.key]=cur.value;cur.continue()}else res(out)};c.onerror=()=>rej(c.error)})}
};
const imgCache={};
async function imgURL(id){if(imgCache[id])return imgCache[id];try{const v=await IDB.get(id);if(v)imgCache[id]=v;return v}catch(e){return null}}
function compress(file,max=1400,q=.72){return new Promise((res,rej)=>{const url=URL.createObjectURL(file);const im=new Image();
  im.onload=()=>{let w=im.naturalWidth,h=im.naturalHeight;const r=Math.min(1,max/Math.max(w,h));w=Math.round(w*r);h=Math.round(h*r);
    const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,w,h);x.drawImage(im,0,0,w,h);URL.revokeObjectURL(url);res(c.toDataURL('image/jpeg',q))};
  im.onerror=()=>{URL.revokeObjectURL(url);rej(new Error('Image illisible'))};im.src=url})}
async function storeImages(files){const ids=[];for(const f of files){if(!f.type.startsWith('image/'))continue;try{const data=await compress(f);const id='img_'+uid();await IDB.set(id,data);imgCache[id]=data;ids.push(id)}catch(e){toast('⚠️ '+e.message)}}return ids}

    const ring=(cx,cy,n)=>{for(let r=22+n*13;r>=22;r-=13)s+=`<circle cx="${cx}" cy="${cy}" r="${r}" fill="#ece4d4" stroke="#d6c8ae" stroke-width="2.2"/>`};
    ring(110,290,8);ring(290,570,9);

/* ---------- Jour ---------- */
function eventsOn(d){return S.events.filter(e=>e.date===d||(e.endDate&&e.date<d&&e.endDate>=d)).sort(byTime)}
function remOccurs(r,d){
  if(r.recur==='day') return !r.date||r.date<=d;
  if(r.recur==='week') return (!r.date||r.date<=d)&&parseD(r.date||d).getDay()===parseD(d).getDay();
  return r.date===d;
}
const remDone=(r,d)=>r.recur&&r.recur!=='none'?r.lastDone===d:!!r.done;
const remindersOn=d=>S.reminders.filter(r=>remOccurs(r,d)).sort(byTime);
const PRIO={haute:0,moyenne:1,basse:2};
function suggest(){
  const t=today(), now=new Date(), end=toMin(S.settings.dayEnd);
  const start=Math.max(toMin(S.settings.dayStart),Math.ceil((now.getHours()*60+now.getMinutes())/15)*15);
  if(start>=end) return [];
  const busy=[...eventsOn(t).filter(e=>e.start&&e.date===t).map(e=>[toMin(e.start),e.end&&e.end>e.start?toMin(e.end):toMin(e.start)+60]),
    ...S.tasks.filter(x=>x.date===t&&x.time&&!x.done).map(x=>[toMin(x.time),toMin(x.time)+(+x.duration||30)])].sort((a,b)=>a[0]-b[0]);
  const free=[]; let cur=start;
  for(const[a,b]of busy){ if(a>cur) free.push([cur,Math.min(a,end)]); cur=Math.max(cur,b); if(cur>=end) break; }
  if(cur<end) free.push([cur,end]);
  const cand=S.tasks.filter(x=>!x.done&&!x.time&&(!x.date||x.date<=t)).sort((a,b)=>PRIO[a.priority]-PRIO[b.priority]||(a.date||'9999').localeCompare(b.date||'9999'));
  const out=[];
  for(const c of cand){ const dur=+c.duration||30; const slot=free.find(([a,b])=>b-a>=dur); if(!slot) continue;
    out.push({task:c,start:slot[0],end:slot[0]+dur}); slot[0]+=dur; if(out.length>=5) break; }
  return out;
}
function taskRow(x){
  const t=today(), late=!x.done&&x.date&&x.date<t, m=[];
  if(x.date) m.push(`<span class="tag ${late?'late':''}">📅 ${fmtDate(x.date)}</span>`);
  if(x.time) m.push(`<span class="tag">🕐 ${x.time}</span>`);
  if(x.duration) m.push(`<span class="tag">⏱ ${fmtDur(x.duration)}</span>`);
  m.push(syncTag(x));
  return `<div class="item ${x.done?'done':''}"><button class="chk ${x.done?'on':''}" data-a="toggleTask" data-id="${x.id}" aria-label="Terminer"></button><div class="grow" data-a="editTask" data-id="${x.id}"><div class="ttl">${esc(x.title)}</div><div class="meta">${m.join('')}</div></div><span class="prio p-${x.priority}"></span></div>`;
}
function eventRow(e,day){
  const c=S.settings.calendars.find(c=>c.id===e.calId);
  const color=(c&&c.color)||e.color||'var(--a1)';
  const multi=e.endDate&&e.endDate!==e.date;
  const tm=e.start&&(!multi||e.date===day)?`${e.start}<small>${e.end||''}</small>`:'<small>Journée</small>';
  return `<div class="item" data-a="editEvent" data-id="${e.id}"><div class="evtime">${tm}</div><span class="evbar" style="background:${esc(color)}"></span><div class="grow"><div class="ttl">${esc(e.title)}</div><div class="meta">${e.place?`<span class="tag">📍 ${esc(e.place)}</span>`:''}${c?`<span class="tag">${esc(c.name)}</span>`:''}${e.readonly?'<span class="tag">🔒</span>':''}${syncTag(e)}</div></div></div>`;
}
function remRow(r){
  const t=today(), d=remDone(r,t), late=r.recur==='none'&&!r.done&&r.date<t;
  const rec=r.recur==='day'?'🔁 Chaque jour':r.recur==='week'?'🔁 Chaque '+JOURS[parseD(r.date||t).getDay()]:'';
  return `<div class="item ${d?'done':''}"><button class="chk round ${d?'on':''}" data-a="toggleRem" data-id="${r.id}" aria-label="Fait"></button><div class="grow" data-a="editRem" data-id="${r.id}"><div class="ttl">🔔 ${esc(r.title)}</div><div class="meta">${rec?`<span class="tag">${rec}</span>`:`<span class="tag ${late?'late':''}">📅 ${fmtDate(r.date)}</span>`}${r.time?`<span class="tag">🕐 ${r.time}</span>`:''}</div></div></div>`;
}
const doneOn=(o,d)=>o.done&&o.doneAt&&iso(new Date(o.doneAt))===d;
VIEWS.jour=()=>{
  const t=today(), d=new Date(), h=d.getHours();
  const hello=h<5?'Bonne nuit':h<12?'Bonjour':h<18?'Bon après-midi':'Bonsoir';
  const tt=S.tasks.filter(x=>x.date===t).sort((a,b)=>a.done-b.done||byTime(a,b)||PRIO[a.priority]-PRIO[b.priority]);
  const dn=tt.filter(x=>x.done).length, pct=tt.length?Math.round(dn/tt.length*100):0;
  const late=S.tasks.filter(x=>!x.done&&x.date&&x.date<t).sort((a,b)=>a.date.localeCompare(b.date));
  const lateR=S.reminders.filter(r=>r.recur==='none'&&!r.done&&r.date<t);
  const evs=eventsOn(t), rems=remindersOn(t), sug=suggest();
  const acc=[...S.tasks.filter(x=>doneOn(x,t)).map(x=>'✅ '+x.title),...S.items.filter(x=>doneOn(x,t)).map(x=>'📁 '+x.text),...S.reminders.filter(r=>remDone(r,t)&&remOccurs(r,t)).map(r=>'🔔 '+r.title)];
  const nn=S.notes.filter(n=>n.status==='review').length;
  const hasData=S.tasks.length+S.items.length+S.events.length>5;
  let html=`<div class="hero"><div class="hero-top"><div><div class="hero-date">${fmtLong(t)}</div><div class="hero-hello">${hello} 👋</div></div><div class="hero-pct">${pct}%</div></div><div class="progress"><i style="width:${pct}%"></i></div><div class="hero-sub">${tt.length?`${dn} / ${plural(tt.length,'tâche')} du jour accomplie${dn>1?'s':''}`:"Aucune tâche prévue aujourd'hui"}${late.length?` · ${late.length} en retard`:''}${evs.length?` · ${plural(evs.length,'événement')}`:''}</div></div>`;
  if(nn) html+=`<button class="banner" data-a="tab" data-id="notes">🎙️ ${plural(nn,'note')} à valider<span class="grow"></span>→</button>`;
  if(hasData&&(!S.settings.lastBackup||Date.now()-S.settings.lastBackup>14*864e5)) html+=`<button class="banner" data-a="export">💾 Pensez à sauvegarder vos données<span class="grow"></span>Exporter</button>`;
  html+=sec('Tâches du jour',tt.length||null)+(tt.length?`<div class="list">${tt.map(taskRow).join('')}</div>`:empty('','Journée libre',`<div><button class="btn sm primary" data-a="newTask" style="margin-top:8px">+ Ajouter une tâche</button></div>`,1));
  if(late.length||lateR.length) html+=sec('En retard',late.length+lateR.length)+`<div class="list">${late.map(taskRow).join('')}${lateR.map(remRow).join('')}</div>`;
  if(sug.length) html+=sec('Proposition d\'organisation')+`<div class="card sugg">${sug.map(s=>`<div class="srow"><span class="stime">${fromMin(s.start)} – ${fromMin(s.end)}</span><span class="grow">${esc(s.task.title)}</span><span class="prio p-${s.task.priority}" style="height:18px"></span><button class="btn sm" data-a="plan" data-id="${s.task.id}" data-v="${fromMin(s.start)}">Caser</button></div>`).join('')}<button class="btn sm primary block" data-a="planAll">✨ Tout planifier</button></div>`;
  if(evs.length) html+=sec('Agenda',evs.length)+`<div class="list">${evs.map(e=>eventRow(e,t)).join('')}</div>`;
  if(rems.length) html+=sec('Rappels',rems.length)+`<div class="list">${rems.map(remRow).join('')}</div>`;
  if(S.habits.length) html+=sec('Habitudes')+`<div class="hchips">${S.habits.map(hb=>`<button class="chip ${hb.log[t]?'on':''}" data-a="habitDay" data-id="${hb.id}" data-v="${t}">${esc(hb.emoji||'⭐')} ${esc(hb.name)}</button>`).join('')}</div>`;
  if(acc.length) html+=sec('Accompli aujourd\'hui',acc.length)+`<div class="card">${acc.map(a=>`<div class="srow small">${esc(a)}</div>`).join('')}</div>`;
  return {title:'Aujourd\'hui',html,actions:syncBtn()};
};

/* ---------- Tâches ---------- */
VIEWS.taches=()=>{
  const t=today();
  let html=chips([['todo','À faire'],['today','Aujourd\'hui'],['done','Terminées'],['all','Toutes']],taskFilter,'taskFilter');
  let L=S.tasks.slice();
  if(taskFilter==='todo') L=L.filter(x=>!x.done);
  if(taskFilter==='today') L=L.filter(x=>x.date===t||(!x.done&&x.date&&x.date<t));
  if(taskFilter==='done') L=L.filter(x=>x.done).sort((a,b)=>(b.doneAt||0)-(a.doneAt||0));
  if(!L.length) html+=empty('✅','Rien ici','Ajoutez une tâche avec le bouton +, ou dictez une note.');
  else if(taskFilter==='done') html+=`<div class="list">${L.map(taskRow).join('')}</div>`;
  else{
    const sorter=(a,b)=>a.done-b.done||(a.date||'').localeCompare(b.date||'')||byTime(a,b)||PRIO[a.priority]-PRIO[b.priority];
    const G=[['En retard',x=>x.date&&x.date<t&&!x.done],['Aujourd\'hui',x=>x.date===t],['Demain',x=>x.date===addDays(t,1)],['Cette semaine',x=>x.date>addDays(t,1)&&x.date<=addDays(t,7)],['Plus tard',x=>x.date>addDays(t,7)],['Sans date',x=>!x.date],['Passées',x=>x.date&&x.date<t&&x.done]];
    const used=new Set();
    for(const[name,fn]of G){ const g=L.filter(x=>!used.has(x)&&fn(x)).sort(sorter); g.forEach(x=>used.add(x)); if(g.length) html+=sec(name,g.length)+`<div class="list">${g.map(taskRow).join('')}</div>`; }
  }
  return {title:'Tâches',html,fab:'newTask',actions:syncBtn()};
};

/* ---------- Todo ---------- */
function folderPath(id){const p=[];let f=S.folders.find(x=>x.id===id);let g=0;while(f&&g++<50){p.unshift(f);f=S.folders.find(x=>x.id===f.parentId)}return p}
function descendants(id){const out=[];const walk=p=>S.folders.filter(f=>f.parentId===p).forEach(f=>{out.push(f.id);walk(f.id)});walk(id);return out}
const countOpen=id=>{const ids=[id,...descendants(id)];return S.items.filter(i=>ids.includes(i.folderId)&&!i.done).length};
function folderOptions(sel,exclude=[]){
  const out=[['','🏠 Accueil (racine)']];
  const walk=(p,depth)=>S.folders.filter(f=>(f.parentId||null)===p&&!exclude.includes(f.id)).forEach(f=>{out.push([f.id,'\u00A0\u00A0'.repeat(depth)+(f.icon||'📁')+' '+f.name]);walk(f.id,depth+1)});
  walk(null,0);
  return out.map(([v,l])=>`<option value="${v}" ${v===(sel||'')?'selected':''}>${esc(l)}</option>`).join('');
}
function tile(f){
  const n=countOpen(f.id), ns=S.folders.filter(x=>x.parentId===f.id).length;
  return `<button class="tile" data-a="openFolder" data-id="${f.id}" style="background:${GRADS[(f.color||0)%GRADS.length]}"><span class="ic">${esc(f.icon||'📁')}</span><span><b>${esc(f.name)}</b><br><small>${n?n+' à faire':'À jour ✓'}${ns?' · '+plural(ns,'dossier'):''}</small></span></button>`;
}
function itemRow(i){
  return `<div class="item todo-item ${i.done?'done':''}" data-id="${i.id}">${i.done?'':'<span class="handle" aria-label="Déplacer">⠿</span>'}<button class="chk round ${i.done?'on':''}" data-a="toggleItem" data-id="${i.id}"></button><div class="grow" data-a="editItem" data-id="${i.id}"><div class="ttl">${linkify(esc(i.text))}</div>${i.images&&i.images.length?`<div class="thumbs">${i.images.map(id=>`<img data-img="${id}" data-a="viewImg" data-id="${id}" alt="">`).join('')}</div>`:''}</div></div>`;
}
VIEWS.todo=()=>{
  if(todoFolder&&!S.folders.find(f=>f.id===todoFolder)) todoFolder=null;
  const cur=todoFolder, path=folderPath(cur);
  let html=`<div class="crumbs"><button class="crumb ${cur?'':'cur'}" data-a="openFolder" data-id="">🏠 Accueil</button>${path.map((p,i)=>`<button class="crumb ${i===path.length-1?'cur':''}" data-a="openFolder" data-id="${p.id}">${esc(p.name)}</button>`).join('')}</div>`;
  const subs=S.folders.filter(f=>(f.parentId||null)===cur);
  const items=S.items.filter(i=>(i.folderId||null)===cur), open=items.filter(i=>!i.done), done=items.filter(i=>i.done);
  if(subs.length) html+=`<div class="tiles" id="tiles">${subs.map(tile).join('')}</div>`;
  html+=`<div class="card addbar"><input id="newItem" type="text" placeholder="${cur?'Ajouter dans « '+esc(path[path.length-1].name)+' »…':'Ajouter un élément…'}" enterkeyhint="done" autocomplete="off"><button class="icon-btn" data-a="addImgNew" aria-label="Ajouter une image">📷</button><button class="btn primary sm" data-a="addItem">Ajouter</button></div>`;
  if(!subs.length&&!items.length) html+=empty('🗂️','Dossier vide','Ajoutez des éléments, collez une capture d\'écran ou créez un sous-dossier avec 📁+.');
  if(open.length) html+=`<div class="list" id="itemsList">${open.map(itemRow).join('')}</div>`;
  if(done.length) html+=`<details class="donebox"><summary>${plural(done.length,'élément terminé','éléments terminés')}</summary><div class="list">${done.map(itemRow).join('')}</div><button class="btn sm ghost danger block" data-a="clearDone">Effacer les terminés</button></details>`;
  if(subs.length||open.length) html+=`<p class="small muted" style="text-align:center;margin-top:16px">Astuce : appui long sur un dossier, ou ⠿ sur un élément, pour réorganiser.</p>`;
  return {title:cur?path[path.length-1].name:'Todo',html,
    actions:`<button class="icon-btn" data-a="newFolder" aria-label="Nouveau dossier">📁+</button>${cur?'<button class="icon-btn" data-a="editFolder" aria-label="Options du dossier">⋯</button>':''}`,
    after(){
      sortable($('#tiles'),'.tile',ids=>{reorder(S.folders,ids);save()});
      sortable($('#itemsList'),'.todo-item',ids=>{reorder(S.items,ids);save()});
    }};
};
function reorder(arr,ids){const set=new Set(ids);const pos=[];arr.forEach((x,i)=>{if(set.has(x.id))pos.push(i)});const objs=ids.map(id=>arr.find(x=>x.id===id)).filter(Boolean);if(objs.length!==pos.length)return;pos.forEach((p,k)=>arr[p]=objs[k])}

/* ---------- Agenda ---------- */
VIEWS.agenda=()=>{
  const t=today(), from=agendaPast?addDays(t,-30):t, to=addDays(t,90), days={};
  const add=(d,o)=>(days[d]=days[d]||[]).push(o);
  S.events.forEach(e=>{let d=e.date,g=0;const end=e.endDate||e.date;while(d<=end&&g++<62){if(d>=from&&d<=to)add(d,{k:'e',o:e,s:e.start&&(d===e.date)?e.start:'00:00'});d=addDays(d,1)}});
  S.tasks.filter(x=>x.date&&x.time&&!x.done&&x.date>=from&&x.date<=to).forEach(x=>add(x.date,{k:'t',o:x,s:x.time}));
  const s=S.settings, pend=S.events.filter(e=>e.sync==='pending').length+S.tasks.filter(x=>x.sync==='pending').length+S.syncDeletes.length;
  let html='';
  if(s.clientId){
    html+=`<div class="card status"><span style="font-size:22px">${tokValid()?'🟢':'🟡'}</span><div class="grow small">${tokValid()?'Connecté à Google Agenda':'Session Google à rouvrir'}<div class="muted">${s.lastSync?'Dernière synchro : '+fmtDate(iso(new Date(s.lastSync)))+' '+hhmm(new Date(s.lastSync)):'Jamais synchronisé'}${pend?' · '+pend+' en attente':''}</div></div><button class="btn sm primary" data-a="sync">Synchroniser</button></div>`;
  } else html+=`<button class="banner" data-a="goSub" data-id="google">🔗 Connecter Google Agenda (synchro dans les 2 sens)<span class="grow"></span>→</button>`;
  html+=`<div style="margin-top:12px">${chips([['0','À venir'],['1','Avec les 30 derniers jours']],agendaPast?'1':'0','agendaPast')}</div>`;
  const keys=Object.keys(days).sort();
  if(!keys.length) html+=empty('📅','Aucun événement','Ajoutez un événement avec +, ou synchronisez Google Agenda.');
  for(const d of keys){
    const L=days[d].sort((a,b)=>a.s.localeCompare(b.s));
    html+=sec(fmtLong(d)+(d===t?' · aujourd\'hui':''),null)+`<div class="list">${L.map(x=>x.k==='e'?eventRow(x.o,d):taskRow(x.o)).join('')}</div>`;
  }
  return {title:'Agenda',html,fab:'newEvent',actions:syncBtn()};
};

/* ---------- Notes ---------- */
function propCard(n,p){
  const key=n.id+':'+p.id, inp=(f,type,val,ph='')=>`<input type="${type}" data-c="prop" data-id="${key}" data-f="${f}" value="${esc(val||'')}" placeholder="${ph}">`;
  let f=inp('title','text',p.title,'Intitulé');
  if(['task','event','reminder'].includes(p.type)) f+=`<div class="row2">${inp('date','date',p.date)}${inp('time','time',p.time)}</div>`;
  if(p.type==='event') f+=`<div class="row2">${inp('end','time',p.end)}${inp('place','text',p.place,'Lieu')}</div>`;
  if(p.type==='task') f+=`<select data-c="prop" data-id="${key}" data-f="priority">${[['haute','🔴 Priorité haute'],['moyenne','🟠 Priorité moyenne'],['basse','🟢 Priorité basse']].map(([v,l])=>`<option value="${v}" ${p.priority===v?'selected':''}>${l}</option>`).join('')}</select>`;
  if(p.type==='reminder') f+=`<select data-c="prop" data-id="${key}" data-f="recur">${[['none','Une seule fois'],['day','Chaque jour'],['week','Chaque semaine']].map(([v,l])=>`<option value="${v}" ${p.recur===v?'selected':''}>${l}</option>`).join('')}</select>`;
  if(p.type==='todo') f+=`<select data-c="prop" data-id="${key}" data-f="folderId">${folderOptions(p.folderId)}</select>`;
  if(p.type==='idea') f+=`<select data-c="prop" data-id="${key}" data-f="libType">${Object.entries(LIBT).map(([v,[i,l]])=>`<option value="${v}" ${p.libType===v?'selected':''}>${i} ${l}</option>`).join('')}</select>`;
  if(p.type==='loan') f+=`<div class="row2">${inp('person','text',p.person,'Prêté à…')}${inp('date','date',p.date)}</div>`;
  return `<div class="prop ${p.conf<.7?'unsure':''}"><div class="tchips">${Object.entries(PT).map(([k,[i,l]])=>`<button class="tchip ${p.type===k?'on':''}" data-a="propType" data-id="${key}" data-v="${k}">${i} ${l}</button>`).join('')}</div>${p.conf<.7?'<div class="warn">⚠️ Classement incertain : vérifiez le type</div>':''}<div class="pf">${f}</div><div class="pbtns"><button class="btn sm ghost" data-a="propSkip" data-id="${key}">Ignorer</button><button class="btn sm primary" data-a="propOk" data-id="${key}">✓ Valider</button></div></div>`;
}
VIEWS.notes=()=>{
  const sr=!!(window.SpeechRecognition||window.webkitSpeechRecognition);
  let html=`<div class="card compose"><textarea id="noteText" placeholder="Dictez ou écrivez, par exemple :&#10;Conseil de cycle jeudi 17h&#10;Acheter des feutres pour la classe&#10;Rappelle-moi d'appeler maman demain soir">${esc(S.draft||'')}</textarea><div class="compose-bar"><button id="micBtn" class="mic ${recOn?'rec':''}" data-a="mic" ${sr?'':'disabled'} aria-label="Dicter">🎙️</button><div class="grow small muted">${sr?(recOn?'<b style="color:var(--text)">J\'écoute…</b> touchez à nouveau pour arrêter.':'Touchez le micro et parlez. Dites « à la ligne » entre deux idées.'):'Dictée vocale disponible dans Chrome uniquement.'}</div></div><button class="btn primary block" data-a="analyze">✨ Analyser et ranger</button></div>`;
  const rev=S.notes.filter(n=>n.status==='review');
  if(rev.length){
    html+=sec('À valider',rev.length);
    for(const n of rev){ const P=n.props.filter(p=>p.status==='pending');
      html+=`<div class="card" style="margin-bottom:12px"><div class="raw">« ${esc(n.text)} »</div>${P.map(p=>propCard(n,p)).join('')}<div class="pbtns" style="margin-top:12px"><button class="btn sm ghost" data-a="noteDiscard" data-id="${n.id}">Tout ignorer</button><button class="btn sm primary" data-a="noteAll" data-id="${n.id}">✓ Tout valider (${P.length})</button></div></div>`; }
  }
  const arch=S.notes.filter(n=>n.status==='archived');
  if(arch.length) html+=`<details style="margin-top:18px"><summary>Archives (${arch.length})</summary><div class="list">${arch.map(n=>`<div class="item" style="align-items:flex-start"><div class="grow"><div class="small muted">${fmtDate(iso(new Date(n.created)))} · ${hhmm(new Date(n.created))}</div><div class="raw">« ${esc(n.text)} »</div><div class="meta" style="flex-direction:column;gap:3px">${(n.props||[]).map(p=>`<span>${p.status==='done'?esc(p.result||''):'✕ ignoré : '+esc(p.title)}</span>`).join('')}</div></div><button class="icon-btn sm" data-a="delNote" data-id="${n.id}" aria-label="Supprimer">🗑</button></div>`).join('')}</div></details>`;
  return {title:'Notes',html};
};

SUBS.rappels=()=>{

  const L=S.reminders.slice().sort((a,b)=>remDone(a,t)-remDone(b,t)||((a.date||'')+(a.time||'')).localeCompare((b.date||'')+(b.time||'')));
  let html=L.length?`<div class="list">${L.map(remRow).join('')}</div>`:empty('🔔','Aucun rappel','Rappels ponctuels ou récurrents (chaque jour, chaque semaine).');

function streak(h){let d=today();if(!h.log[d])d=addDays(d,-1);let n=0;while(h.log[d]){n++;d=addDays(d,-1)}return n}
SUBS.habitudes=()=>{

SUBS.stats=()=>{
  const t=today(), days=[...Array(7)].map((_,i)=>addDays(t,i-6));
  const doneBy=d=>S.tasks.filter(x=>doneOn(x,d)).length+S.items.filter(x=>doneOn(x,d)).length;
  const vals=days.map(doneBy), max=Math.max(1,...vals), wk=vals.reduce((a,b)=>a+b,0);
  const prev=[...Array(7)].map((_,i)=>doneBy(addDays(t,i-13))).reduce((a,b)=>a+b,0);
  const delta=wk-prev, created=S.tasks.filter(x=>x.created&&iso(new Date(x.created))>=days[0]).length;
  const late=S.tasks.filter(x=>!x.done&&x.date&&x.date<t).length;
  const notes=S.notes.filter(n=>n.created&&iso(new Date(n.created))>=days[0]).length;

  html+=sec('Accompli par jour')+`<div class="card"><div class="bars">${days.map((d,i)=>`<div><b>${vals[i]||''}</b><i style="height:${vals[i]/max*100}%"></i>${'DLMMJVS'[parseD(d).getDay()]}</div>`).join('')}</div></div>`;
  html+=`<div class="kpis"><div class="kpi"><b>${created}</b><span>tâches créées</span></div><div class="kpi"><b>${late}</b><span>en retard</span></div><div class="kpi"><b>${notes}</b><span>notes dictées</span></div><div class="kpi"><b>${S.loans.filter(l=>!l.returned).length}</b><span>prêts en cours</span></div></div>`;
  if(hp.length) html+=sec('Habitudes')+`<div class="card">${hp.map(([h,n])=>`<div class="srow"><span class="grow">${esc(h.emoji||'⭐')} ${esc(h.name)}</span><span class="small muted">${n}/7</span><div class="progress" style="width:90px"><i style="width:${n/7*100}%"></i></div></div>`).join('')}</div>`;
  return {title:'Statistiques',html};
};

let sheetCtx={}, sheetOpen=false, ignorePop=false;
const fld=(label,inner)=>`<label class="fld"><span>${label}</span>${inner}</label>`;
const inp=(name,val='',type='text',extra='')=>`<input name="${name}" type="${type}" value="${esc(val)}" ${extra}>`;
const selF=(name,opts,val)=>`<select name="${name}">${opts.map(([v,l])=>`<option value="${esc(v)}" ${String(v)===String(val)?'selected':''}>${esc(l)}</option>`).join('')}</select>`;
const seg=(name,opts,val)=>`<div class="seg">${opts.map(([v,l])=>`<label><input type="radio" name="${name}" value="${v}" ${v===val?'checked':''}><span>${l}</span></label>`).join('')}</div>`;
function openSheet(title,body,opt={}){
  const sh=$('#sheet');
  sh.innerHTML=`<div class="grab"></div><div class="sh-head"><h2>${esc(title)}</h2><button type="button" class="icon-btn sm" data-a="closeSheet" aria-label="Fermer">✕</button></div><form id="shForm" autocomplete="off">${body}${opt.onSave||opt.onDelete?`<div class="sh-foot">${opt.onDelete?'<button type="button" class="btn ghost danger" data-a="sheetDelete">Supprimer</button>':''}${opt.onSave?`<button class="btn primary">${opt.saveLabel||'Enregistrer'}</button>`:''}</div>`:''}</form>`;
  sheetCtx=opt;
  $('#shForm').onsubmit=e=>{e.preventDefault();const fd=Object.fromEntries(new FormData(e.target));if(sheetCtx.onSave&&sheetCtx.onSave(fd)!==false)closeSheet()};
  const w=$('#sheetWrap'); w.classList.remove('hidden'); requestAnimationFrame(()=>requestAnimationFrame(()=>w.classList.add('open')));
  if(!sheetOpen) history.pushState({sheet:1},'');
  sheetOpen=true;
  const af=sh.querySelector('[autofocus]'); if(af) setTimeout(()=>af.focus(),260);
}
function hideSheet(){sheetOpen=false;const w=$('#sheetWrap');w.classList.remove('open');setTimeout(()=>{if(!sheetOpen)w.classList.add('hidden')},230)}
function closeSheet(){if(!sheetOpen)return;hideSheet();if(history.state&&history.state.sheet){ignorePop=true;history.back()}}

function markPending(o,kind){
  o.updatedAt=Date.now();
  if(kind==='event'){ if(!o.readonly) o.sync='pending'; }
  else if(kind==='task'){ if((S.settings.pushTasks&&!o.noSync&&o.date)||o.gid) o.sync='pending'; }
  queueSync();
}
function removeUndo(key,obj,label){
  const arr=S[key], i=arr.indexOf(obj); if(i<0) return;
  arr.splice(i,1);
  let del=null;
  if(obj.gid&&!obj.readonly){del={calId:obj.calId||S.settings.targetCal,gid:obj.gid};S.syncDeletes.push(del);queueSync()}
  save(); render();
  toast(label+' supprimé','Annuler',()=>{
    S[key].splice(Math.min(i,S[key].length),0,obj);
    if(del){ if(S.syncDeletes.includes(del)) S.syncDeletes=S.syncDeletes.filter(d=>d!==del); else {obj.gid=null;obj.sync='pending'} }
    save(); render();
  });
}

function taskSheet(x){
  const isNew=!x;
  const v=x||{title:'',date:view==='taches'&&taskFilter!=='today'?'':today(),time:'',priority:'moyenne',duration:S.settings.defaultDuration};
  openSheet(isNew?'Nouvelle tâche':'Modifier la tâche',
    fld('Intitulé',inp('title',v.title,'text','required autofocus'))+
    `<div class="row2">${fld('Date',inp('date',v.date,'date'))}${fld('Heure (optionnel)',inp('time',v.time,'time'))}</div>`+
    fld('Priorité',seg('priority',[['haute','🔴 Haute'],['moyenne','🟠 Moyenne'],['basse','🟢 Basse']],v.priority))+
    fld('Durée estimée',selF('duration',[15,30,45,60,90,120,180,240].map(m=>[m,fmtDur(m)]),v.duration||30))+
    fld('Note',`<textarea name="notes" style="min-height:60px">${esc(v.notes||'')}</textarea>`)+
    (x&&x.noSync?`<label class="srow"><span class="grow small">Ne plus synchroniser avec Google (supprimée de l'agenda)</span><input type="checkbox" class="sw" name="noSync" checked></label>`:''),
    {onSave(fd){
      const title=fd.title.trim(); if(!title) return false;
      const o=x||{id:uid(),done:false,created:Date.now()};
      Object.assign(o,{title,date:fd.date,time:fd.time,priority:fd.priority,duration:+fd.duration,notes:fd.notes.trim()});
      if(x&&x.noSync&&!fd.noSync) o.noSync=false;
      if(isNew) S.tasks.push(o);
      markPending(o,'task'); save(); render(); toast(isNew?'✅ Tâche ajoutée':'Tâche modifiée');
    },onDelete:isNew?null:()=>{closeSheet();removeUndo('tasks',x,'Tâche')}});
}
function eventSheet(e,preset){
  const isNew=!e;
  if(e&&e.readonly){
    openSheet(e.title,`<div class="card" style="box-shadow:none"><div class="srow">📅 ${fmtLong(e.date)}${e.endDate&&e.endDate!==e.date?' → '+fmtLong(e.endDate):''}</div>${e.start?`<div class="srow">🕐 ${e.start} – ${e.end||''}</div>`:''}${e.place?`<div class="srow">📍 ${esc(e.place)}</div>`:''}${e.notes?`<div class="srow small">${linkify(esc(e.notes))}</div>`:''}<div class="srow small muted">🔒 Agenda « ${esc(e.calName||'')} » en lecture seule</div></div>`);
    return;
  }
  const v=e||{title:'',date:preset||today(),start:'',end:'',place:'',notes:'',calId:S.settings.targetCal};
  const cals=S.settings.calendars.filter(c=>!['reader','freeBusyReader'].includes(c.role));
  openSheet(isNew?'Nouvel événement':'Modifier l\'événement',
    fld('Titre',inp('title',v.title,'text','required autofocus'))+
    `<div class="row2">${fld('Date',inp('date',v.date,'date','required'))}${fld('Fin (plusieurs jours)',inp('endDate',v.endDate||'','date'))}</div>`+
    `<div class="row2">${fld('Début',inp('start',v.start,'time'))}${fld('Fin',inp('end',v.end,'time'))}</div>`+
    fld('Lieu',inp('place',v.place))+
    (cals.length?fld('Agenda Google',selF('calId',cals.map(c=>[c.id,c.name]),v.calId||S.settings.targetCal)):'')+
    fld('Notes',`<textarea name="notes" style="min-height:60px">${esc(v.notes||'')}</textarea>`),
    {onSave(fd){
      const title=fd.title.trim(); if(!title||!fd.date) return false;
      const o=e||{id:uid(),source:'local',created:Date.now()};
      let end=fd.end; if(fd.start&&(!end||(end<=fd.start&&(!fd.endDate||fd.endDate===fd.date)))) end=fromMin(Math.min(toMin(fd.start)+60,1439));
      const newCal=fd.calId||o.calId||S.settings.targetCal;
      if(o.gid&&o.calId&&newCal!==o.calId){S.syncDeletes.push({calId:o.calId,gid:o.gid});o.gid=null}
      const c=S.settings.calendars.find(c=>c.id===newCal);
      Object.assign(o,{title,date:fd.date,endDate:fd.endDate&&fd.endDate>fd.date?fd.endDate:null,start:fd.start,end:fd.start?end:'',place:fd.place.trim(),notes:fd.notes.trim(),calId:newCal,calName:c?c.name:''});
      if(isNew) S.events.push(o);
      markPending(o,'event'); save(); render(); toast(isNew?'📅 Événement ajouté':'Événement modifié');
    },onDelete:isNew?null:()=>{closeSheet();removeUndo('events',e,'Événement')}});
}

  const ta=$('#noteText'); if(!ta) return;
  rec=new SR(); rec.lang='fr-FR'; rec.interimResults=true; rec.continuous=!/Android/i.test(navigator.userAgent);
  const base=ta.value.trim()?ta.value.replace(/\s*$/,'\n'):''; let fin='';
  const clean=s=>s.replace(/\s*\b(?:point à la ligne|à la ligne|nouvelle ligne|retour à la ligne)\b\s*/gi,'\n').replace(/\s*\bpoint virgule\b\s*/gi,' ; ');

    const target=S.settings.targetCal;
    // 1. suppressions
    for(const d of S.syncDeletes.slice()){ if(!isReadonly(d.calId)) await gapi('DELETE',`/calendars/${enc(d.calId)}/events/${enc(d.gid)}`); S.syncDeletes=S.syncDeletes.filter(x=>x!==d); up++; }
    save();
    // 2. envoi des événements
    for(const e of S.events.filter(e=>e.sync==='pending')){
      const cal=e.calId||target; if(isReadonly(cal)){e.sync='ok';continue}
      const r=e.gid?await gapi('PATCH',`/calendars/${enc(cal)}/events/${enc(e.gid)}`,gEventBody(e)):await gapi('POST',`/calendars/${enc(cal)}/events`,gEventBody(e));
      if(r){e.gid=r.id;e.gUpdated=r.updated} e.calId=cal; e.sync='ok'; up++; save();
    }
    // 3. envoi des tâches
    for(const x of S.tasks.filter(x=>x.sync==='pending')){
      const cal=x.calId||target;
      if(!x.date||x.noSync||!S.settings.pushTasks){ if(x.gid){await gapi('DELETE',`/calendars/${enc(cal)}/events/${enc(x.gid)}`);x.gid=null;up++} x.sync=null; continue; }
      const r=x.gid?await gapi('PATCH',`/calendars/${enc(cal)}/events/${enc(x.gid)}`,gTaskBody(x)):await gapi('POST',`/calendars/${enc(cal)}/events`,gTaskBody(x));
      if(r){x.gid=r.id;x.gUpdated=r.updated} x.calId=cal; x.sync='ok'; up++; save();
    }
    // 4. réception depuis Google
    const tMin=new Date();tMin.setDate(tMin.getDate()-30);tMin.setHours(0,0,0,0);
    const tMax=new Date();tMax.setDate(tMax.getDate()+120);
    const minD=iso(tMin),maxD=iso(tMax);
    for(const c of S.settings.calendars.filter(c=>c.import)){
      const list=[];let page=null,g=0;
      do{const q=new URLSearchParams({timeMin:tMin.toISOString(),timeMax:tMax.toISOString(),singleEvents:'true',maxResults:'2500'});if(page)q.set('pageToken',page);
        const r=await gapi('GET',`/calendars/${enc(c.id)}/events?${q}`);list.push(...(r.items||[]));page=r.nextPageToken}while(page&&g++<10);
      const seen=new Set();
      for(const ge of list){
        if(ge.status==='cancelled'||!ge.start) continue;
        seen.add(ge.id);
        const mo=ge.extendedProperties&&ge.extendedProperties.private;
        if(mo&&mo.moType==='task'){
          const x=S.tasks.find(x=>x.gid===ge.id);
          if(x&&x.sync!=='pending'&&ge.updated!==x.gUpdated){const f=fromG(ge);x.title=(ge.summary||'').replace(/^(?:✅|✔️|✔|☑️)\s*/u,'')||x.title;x.date=f.date;x.time=f.start||'';if(f.start&&f.end)x.duration=Math.max(5,toMin(f.end)-toMin(f.start));const wasDone=x.done;x.done=/^✔/.test(ge.summary||'');if(x.done&&!wasDone)x.doneAt=Date.now();x.gUpdated=ge.updated;down++}
          continue;
        }
        let e=S.events.find(e=>e.gid===ge.id&&(e.calId===c.id||!e.calId));
        if(e&&e.sync==='pending') continue;
        if(e&&e.gUpdated===ge.updated) continue;
        if(!e){e={id:uid(),gid:ge.id,source:'google',created:Date.now()};S.events.push(e)}
        const f=fromG(ge);
        Object.assign(e,{title:ge.summary||'(Sans titre)',date:f.date,endDate:f.endDate,start:f.start,end:f.end,place:ge.location||'',notes:(ge.description||'').replace(/<[^>]+>/g,' ').trim(),calId:c.id,calName:c.name,color:c.color,sync:'ok',gUpdated:ge.updated,readonly:['reader','freeBusyReader'].includes(c.role)});
        down++;
      }
      const before=S.events.length;
      S.events=S.events.filter(e=>!(e.gid&&e.calId===c.id&&e.sync!=='pending'&&e.date>=minD&&e.date<=maxD&&!seen.has(e.gid)));
      down+=before-S.events.length;
      S.tasks.forEach(x=>{if(x.gid&&x.calId===c.id&&x.sync!=='pending'&&x.date>=minD&&x.date<=maxD&&!seen.has(x.gid)){x.gid=null;x.sync=null;x.noSync=true}});
    }
    S.settings.lastSync=Date.now(); save();
    if(interactive||up||down) toast(`🔄 Synchronisé · ${up} envoyé${up>1?'s':''}, ${down} reçu${down>1?'s':''}`);
  }catch(err){
    if(err.message==='auth'){ if(interactive) toast('Session Google expirée : reconnectez-vous'); }
    else toast('⚠️ '+err.message);
  }finally{ syncing=false; save(); if(!sheetOpen) render(); }
}

async function checkReminders(){
  if(!S.settings.notif||!('Notification' in window)||Notification.permission!=='granted') return;
  const t=today(), now=hhmm(new Date()); let changed=false;
  for(const r of remindersOn(t)){
    if(r.time&&r.time<=now&&r.notified!==t&&!remDone(r,t)){
      r.notified=t; changed=true;
      try{const reg=navigator.serviceWorker&&await navigator.serviceWorker.getRegistration();if(reg)reg.showNotification('🔔 '+r.title,{body:'Rappel de '+r.time,icon:'icon-192.png',badge:'icon-192.png',tag:r.id});else new Notification('🔔 '+r.title,{body:'Rappel de '+r.time})}catch(e){}
    }
  }
  if(changed) save();
}

/* ================= Glisser-déposer ================= */
const DND={s:null,timer:null,suppress:false,x:0,y:0};
function sortable(container,sel,onEnd){
  if(!container) return;
  container.addEventListener('pointerdown',e=>{
    const el=e.target.closest(sel); if(!el||!container.contains(el)||e.button>0) return;
    const handle=e.target.closest('.handle');
    if(!handle&&e.target.closest('.chk,input,textarea,select,img,a')) return;
    DND.x=e.clientX;DND.y=e.clientY;clearTimeout(DND.timer);
    const start=()=>{DND.timer=null;DND.s={el,sel,onEnd,parent:el.parentNode};el.classList.add('dragging');if(navigator.vibrate)navigator.vibrate(12)};
    if(handle){e.preventDefault();start()} else DND.timer=setTimeout(start,430);
  });
}
window.addEventListener('pointermove',e=>{
  if(DND.timer&&!DND.s&&Math.hypot(e.clientX-DND.x,e.clientY-DND.y)>10){clearTimeout(DND.timer);DND.timer=null}
  if(!DND.s) return;
  const o=(document.elementFromPoint(e.clientX,e.clientY)||document.body).closest(DND.s.sel);
  if(o&&o!==DND.s.el&&o.parentNode===DND.s.parent){const sib=[...DND.s.parent.children];const after=sib.indexOf(o)>sib.indexOf(DND.s.el);DND.s.parent.insertBefore(DND.s.el,after?o.nextSibling:o)}
},{passive:true});
window.addEventListener('touchmove',e=>{if(DND.s&&e.cancelable)e.preventDefault()},{passive:false});
const endDrag=()=>{clearTimeout(DND.timer);DND.timer=null;if(!DND.s)return;const s=DND.s;DND.s=null;s.el.classList.remove('dragging');DND.suppress=true;setTimeout(()=>DND.suppress=false,400);s.onEnd([...s.parent.children].filter(c=>c.matches(s.sel)).map(c=>c.dataset.id))};
window.addEventListener('pointerup',endDrag);window.addEventListener('pointercancel',endDrag);
document.addEventListener('contextmenu',e=>{if(e.target.closest('.tile,.todo-item'))e.preventDefault()});

let toastT;

  const el=$('#toast'); el.innerHTML=`<span>${esc(msg)}</span>${btn?`<button>${esc(btn)}</button>`:''}`;
  if(btn) el.querySelector('button').onclick=()=>{el.classList.remove('show');fn()};
  el.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>el.classList.remove('show'),btn?5500:2600);
}

  if(navigator.storage&&navigator.storage.persist) navigator.storage.persist().catch(()=>{});
  if(S.settings.clientId&&navigator.onLine) loadGIS().catch(()=>{});
  setInterval(checkReminders,30000); checkReminders();
  if(tokValid()&&S.settings.autoSync) setTimeout(()=>sync(false),1200);
  document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible'){ if(!sheetOpen&&document.activeElement.tagName!=='TEXTAREA') render(); checkReminders(); if(tokValid()&&S.settings.autoSync) sync(false); } });
  matchMedia('(prefers-color-scheme: light)').addEventListener('change',applyTheme);
}
init();
</script>
